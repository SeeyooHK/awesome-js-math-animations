<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Blue Vortex Sky</title>
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #message {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 2rem;
      color: #f7c77a;
      font: 500 0.95rem/1.5 system-ui, sans-serif;
      text-align: center;
      background: #080400;
    }
  </style>
</head>
<body>
  <canvas id="gl-canvas" aria-label="Animated dark blue sky with swirling golden clouds"></canvas>
  <div id="message" role="alert"></div>

  <script>
    (() => {
      const canvas = document.querySelector('#gl-canvas');
      const message = document.querySelector('#message');
      const gl = canvas.getContext('webgl2', {
        alpha: false,
        antialias: false,
        depth: false,
        powerPreference: 'high-performance'
      });

      const fail = (text) => {
        canvas.hidden = true;
        message.style.display = 'grid';
        message.textContent = text;
      };

      if (!gl) {
        fail('This animation needs a browser with WebGL 2 support.');
        return;
      }

      const vertexSource = `#version 300 es
        in vec2 a_position;

        void main() {
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fragmentSource = `#version 300 es
        precision highp float;

        uniform vec2 u_resolution;
        uniform float u_time;
        out vec4 fragColor;

        float hash21(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        float noise2D(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
            mix(hash21(i + vec2(0.0, 1.0)), hash21(i + 1.0), f.x),
            f.y
          );
        }

        float fbm(vec2 p) {
          float value = 0.0;
          float amplitude = 0.5;
          mat2 octaveRotation = mat2(0.8, -0.6, 0.6, 0.8);
          for (int i = 0; i < 6; i++) {
            value += noise2D(p) * amplitude;
            p = octaveRotation * p * 2.03 + 17.17;
            amplitude *= 0.5;
          }
          return value;
        }

        mat2 rotate2D(float a) {
          float c = cos(a);
          float s = sin(a);
          return mat2(c, -s, s, c);
        }

        void main() {
          vec2 r = u_resolution;
          vec2 FC = gl_FragCoord.xy;
          float t = u_time;
          vec2 uv = FC.xy / r;
          vec2 p = (FC.xy - 0.5 * r) / r.y - vec2(0.07, 0.015);
          float radius = length(p);
          float angle = atan(p.y, p.x);

          float twist = 3.8 / (0.32 + radius * 2.6) - t * 0.055;
          vec2 flow = rotate2D(twist) * p;
          flow.x *= 1.18;

          vec2 slowDrift = vec2(t * 0.012, -t * 0.006);
          vec2 warp = vec2(
            fbm(flow * 1.1 + slowDrift + vec2(1.7, 8.2)),
            fbm(flow * 1.1 - slowDrift + vec2(7.4, 2.3))
          ) - 0.5;

          float broadMist = fbm(flow * 1.75 + warp * 1.15 + slowDrift);
          float fineMist = fbm(flow * 6.2 + warp * 2.0 - slowDrift * 1.8);
          float grainNoise = noise2D(flow * 23.0 + warp * 3.0 + t * 0.08);

          vec3 deepBlue = vec3(0.006, 0.035, 0.075);
          vec3 horizonBlue = vec3(0.018, 0.12, 0.22);
          vec3 color = mix(horizonBlue, deepBlue, smoothstep(0.05, 0.95, uv.y));

          float blueClouds = smoothstep(0.36, 0.72, broadMist)
            * (0.55 + fineMist * 0.45);
          color += vec3(0.025, 0.16, 0.29) * blueClouds * 1.35;

          float ridges = 1.0 - abs(fineMist * 2.0 - 1.0);
          ridges = pow(clamp(ridges, 0.0, 1.0), 7.0);
          float filaments = smoothstep(0.56, 0.82, broadMist + ridges * 0.28);
          filaments *= smoothstep(0.075, 0.19, radius);
          filaments *= 0.45 + grainNoise * 0.55;

          vec3 mutedGold = vec3(0.58, 0.39, 0.21);
          vec3 paleGold = vec3(0.88, 0.68, 0.42);
          color += mix(mutedGold, paleGold, ridges) * filaments * 0.72;

          float vortexRing = exp(-abs(radius - 0.17) * 20.0)
            * (0.35 + 0.65 * noise2D(vec2(angle * 2.4, t * 0.05)));
          color += vec3(0.10, 0.28, 0.39) * vortexRing * 0.5;

          float darkEye = 1.0 - smoothstep(0.025, 0.19, radius);
          color *= 1.0 - darkEye * 0.72;

          vec2 starCell = floor(FC.xy * 0.42);
          float starSeed = hash21(starCell);
          float stars = step(0.992, starSeed)
            * smoothstep(0.44, 0.78, grainNoise)
            * (1.0 - darkEye);
          color += vec3(0.65, 0.76, 0.82) * stars * 0.65;

          float vignette = 1.0 - smoothstep(
            0.22,
            1.0,
            length((uv - 0.5) * vec2(1.0, 0.76))
          );
          color *= 0.62 + vignette * 0.38;
          fragColor = vec4(color, 1.0);
        }
      `;

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const error = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error(error);
        }
        return shader;
      }

      try {
        const program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program));
        }

        gl.useProgram(program);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW
        );

        const position = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

        const resolution = gl.getUniformLocation(program, 'u_resolution');
        const time = gl.getUniformLocation(program, 'u_time');
        let startTime = performance.now();
        let pausedAt = 0;
        let paused = false;

        function resize() {
          const displayWidth = canvas.clientWidth;
          const displayHeight = canvas.clientHeight;
          const displayPixels = Math.max(1, displayWidth * displayHeight);
          const pixelBudget = 1_250_000;
          const pixelRatio = Math.min(
            window.devicePixelRatio || 1,
            1,
            Math.sqrt(pixelBudget / displayPixels)
          );
          const width = Math.max(1, Math.round(displayWidth * pixelRatio));
          const height = Math.max(1, Math.round(displayHeight * pixelRatio));

          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
            gl.viewport(0, 0, width, height);
          }
        }

        function render(now) {
          resize();
          gl.uniform2f(resolution, canvas.width, canvas.height);
          gl.uniform1f(time, (now - startTime) * 0.001);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          if (!paused) requestAnimationFrame(render);
        }

        document.addEventListener('visibilitychange', () => {
          if (document.hidden && !paused) {
            paused = true;
            pausedAt = performance.now();
          } else if (!document.hidden && paused) {
            startTime += performance.now() - pausedAt;
            paused = false;
            requestAnimationFrame(render);
          }
        });

        requestAnimationFrame(render);
      } catch (error) {
        console.error(error);
        fail('The shader could not be started on this device.');
      }
    })();
  </script>
</body>
</html>

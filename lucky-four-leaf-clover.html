<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>p5.js Sketch</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #090909;
    }

    body {
      display: grid;
      place-items: center;
    }

    .artwork {
      display: grid;
      justify-items: center;
      gap: 18px;
      padding: 24px;
    }

    #sketch {
      line-height: 0;
    }

    canvas {
      display: block;
    }

    .caption {
      color: transparent;
      background: linear-gradient(90deg, #38c867, #d9ffe2, #38c867);
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      font: 500 24px/1.2 Georgia, serif;
      letter-spacing: .08em;
      text-align: center;
      text-shadow: 0 0 18px rgba(76, 220, 112, .18);
      --caption-x: 12px;
      animation: shimmer 5s linear infinite, float 3.6s ease-in-out infinite;
    }

    @keyframes shimmer {
      to {
        background-position: 200% center;
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(var(--caption-x), 0);
      }

      50% {
        transform: translate(var(--caption-x), -4px);
      }
    }
  </style>
</head>

<body>
  <main class="artwork">
    <div id="sketch"></div>
    <div class="caption">Lucky Four-Leaf Clover</div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script>
    a = i => {
      if (i < 190) {
        v = (i % 95) / 94, o = (i / 95 | 0) - .5
        return stroke(74, 190, 104, 155).strokeWeight(1.3)
          .point(B(v) + o * 1.25, lerp(Y, 520, v))
      }
      if (i == 4410)
        return stroke(186, 255, 184, 230).strokeWeight(3).point(X, Y)

      i -= 190
      l = i / 1055 | 0, n = i % 1055, p = l * 1.6
      z = A[l] + .04 * sin(.7 * t) + .018 * sin(.9 * t + p)
      c = cos(z), s = sin(z), d = S[l], u = W[l]

      if (n < 900) {
        h = (n * 2.399963 + p) % TAU
        v = .1 + .9 * sqrt((n * .754877666 + p * .137) % 1)
        q = d / 29 * v * (1 + .025 * sin(.8 * t + p + 2 * h))
        x = 16 * sin(h) ** 3 * u * q
        y = (13 * cos(h) - 5 * cos(2 * h) - 2 * cos(3 * h) - cos(4 * h) + 17) * 1.18 * q
        g = sin(PI * v)
        stroke(42 + 100 * g, 132 + 98 * g, 48 + 72 * g, 115 + 65 * g)
        strokeWeight(n % 113 ? 1.35 : 1.8)
        if (!(n % 113)) stroke(205, 255, 207, 190)
      } else if (n < 996) {
        h = TAU * (n - 900) / 96
        q = d / 29 * (1 + .025 * sin(.8 * t + p + 2 * h))
        x = 16 * sin(h) ** 3 * u * q
        y = (13 * cos(h) - 5 * cos(2 * h) - 2 * cos(3 * h) - cos(4 * h) + 17) * 1.18 * q
        stroke(42, 178, 62, 205).strokeWeight(1.6)
      } else if (n < 1029) {
        v = (n - 995) / 34
        y = d * .92 * v
        x = 1.8 * sin(PI * v) * sin(.7 * t + p)
        stroke(111, 222, 116, 145).strokeWeight(1.25)
      } else {
        v = ((n - 1029) % 13 + 1) / 14
        y = d * (.25 + .33 * v)
        x = ((n - 1029) / 13 | 0 ? 1 : -1) * d * .2 * v
        stroke(111, 222, 116, 145).strokeWeight(1.25)
      }
      point(X + y * c - x * s, Y + y * s + x * c)
    }

    t = 0, draw = $ => {
      t || createCanvas(w = 520, w).parent('sketch')
      background(6, 8, 11), t += PI / 240
      X = 260 + 12 * sin(.7 * t), Y = 235 + 1.5 * sin(.55 * t)
      B = v => lerp(X, 278, v) + (8 + 2 * sin(.65 * t + 2.5 * v)) * sin(PI * v)
      A = [-2.34, -.87, .63, 2.44], S = [70, 68, 71, 69], W = [.94, .9, .96, .92]
      for (i = 0; i < 4411; i++) a(i)
    }
  </script>
</body>

</html>

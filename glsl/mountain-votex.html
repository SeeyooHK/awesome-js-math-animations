<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinite Ember Vortex</title>
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #message {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 2rem;
      color: #f7c77a;
      font: 500 0.95rem/1.5 system-ui, sans-serif;
      text-align: center;
      background: #080400;
    }
  </style>
</head>
<body>
  <canvas id="gl-canvas" aria-label="Animated golden volumetric vortex"></canvas>
  <div id="message" role="alert"></div>

  <script>
    (() => {
      const canvas = document.querySelector('#gl-canvas');
      const message = document.querySelector('#message');
      const gl = canvas.getContext('webgl2', {
        alpha: false,
        antialias: false,
        depth: false,
        powerPreference: 'high-performance'
      });

      const fail = (text) => {
        canvas.hidden = true;
        message.style.display = 'grid';
        message.textContent = text;
      };

      if (!gl) {
        fail('This animation needs a browser with WebGL 2 support.');
        return;
      }

      const vertexSource = `#version 300 es
        in vec2 a_position;

        void main() {
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fragmentSource = `#version 300 es
        precision highp float;

        uniform vec2 u_resolution;
        uniform float u_time;
        out vec4 fragColor;

        vec3 hsv(float h, float s, float v) {
          vec4 t = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
          vec3 p = abs(fract(vec3(h) + t.xyz) * 6.0 - vec3(t.w));
          return v * mix(vec3(t.x), clamp(p - vec3(t.x), 0.0, 1.0), s);
        }

        mat2 rotate2D(float a) {
          return mat2(cos(a), -sin(a), sin(a), cos(a));
        }

        void main() {
          vec2 r = u_resolution;
          vec2 FC = gl_FragCoord.xy;
          float t = u_time;
          vec4 o = vec4(0.0, 0.0, 0.0, 1.0);

          float e = 0.0;
          float R = 0.0;
          float s = 0.0;
          vec3 q = vec3(0.0, -1.0, -1.0);
          vec3 p = vec3(0.0);

          vec3 d = vec3((FC.xy - 0.5 * r) / r.x * 0.4 + vec2(0.0, 0.85), 0.5);

          for (int i = 0; i < 67; i++) {
            o.rgb += hsv(0.1, e, min(e * s, 1.0) / 64.0);

            s = 3.0;
            p = q += d * e * R * 0.5 + 1e-4;

            R = length(p);
            p = vec3(
              log(R) - t * 0.3,
              exp(-p.z / R) + 0.2,
              atan(p.y, p.x)
            );

            p.y -= 1.0;
            e = p.y;
            for (; s < 1e3; s += s) {
              e += sin(dot(cos(p.zyy * s), 0.5 + cos(p.xxz * s))) / s * 0.3;
            }
          }

          fragColor = o;
        }
      `;

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const error = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error(error);
        }
        return shader;
      }

      try {
        const program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program));
        }

        gl.useProgram(program);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW
        );

        const position = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

        const resolution = gl.getUniformLocation(program, 'u_resolution');
        const time = gl.getUniformLocation(program, 'u_time');
        let startTime = performance.now();
        let pausedAt = 0;
        let paused = false;

        function resize() {
          const displayWidth = canvas.clientWidth;
          const displayHeight = canvas.clientHeight;
          const displayPixels = Math.max(1, displayWidth * displayHeight);
          const pixelBudget = 1_250_000;
          const pixelRatio = Math.min(
            window.devicePixelRatio || 1,
            1,
            Math.sqrt(pixelBudget / displayPixels)
          );
          const width = Math.max(1, Math.round(displayWidth * pixelRatio));
          const height = Math.max(1, Math.round(displayHeight * pixelRatio));

          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
            gl.viewport(0, 0, width, height);
          }
        }

        function render(now) {
          resize();
          gl.uniform2f(resolution, canvas.width, canvas.height);
          gl.uniform1f(time, (now - startTime) * 0.001);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          if (!paused) requestAnimationFrame(render);
        }

        document.addEventListener('visibilitychange', () => {
          if (document.hidden && !paused) {
            paused = true;
            pausedAt = performance.now();
          } else if (!document.hidden && paused) {
            startTime += performance.now() - pausedAt;
            paused = false;
            requestAnimationFrame(render);
          }
        });

        requestAnimationFrame(render);
      } catch (error) {
        console.error(error);
        fail('The shader could not be started on this device.');
      }
    })();
  </script>
</body>
</html>

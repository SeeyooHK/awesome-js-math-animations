<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinite Ember Vortex</title>
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #message {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 2rem;
      color: #f7c77a;
      font: 500 0.95rem/1.5 system-ui, sans-serif;
      text-align: center;
      background: #080400;
    }
  </style>
</head>
<body>
  <canvas id="gl-canvas" aria-label="Animated golden volumetric vortex"></canvas>
  <div id="message" role="alert"></div>

  <script>
    (() => {
      const canvas = document.querySelector('#gl-canvas');
      const message = document.querySelector('#message');
      const gl = canvas.getContext('webgl2', {
        alpha: false,
        antialias: false,
        depth: false,
        powerPreference: 'high-performance'
      });

      const fail = (text) => {
        canvas.hidden = true;
        message.style.display = 'grid';
        message.textContent = text;
      };

      if (!gl) {
        fail('This animation needs a browser with WebGL 2 support.');
        return;
      }

      const vertexSource = `#version 300 es
        in vec2 a_position;

        void main() {
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fragmentSource = `#version 300 es
        precision highp float;

        uniform vec2 u_resolution;
        uniform float u_time;
        out vec4 fragColor;

        vec3 hsv(float h, float s, float v) {
          vec4 t = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
          vec3 p = abs(fract(vec3(h) + t.xyz) * 6.0 - vec3(t.w));
          return v * mix(vec3(t.x), clamp(p - vec3(t.x), 0.0, 1.0), s);
        }

        mat2 rotate2D(float a) {
          return mat2(cos(a), -sin(a), sin(a), cos(a));
        }

        vec3 volumetricField(vec2 FC, vec2 r, float t) {
          vec3 color = vec3(0.0);
          float e = 0.0;
          float R = 0.0;
          float s = 0.0;
          vec3 q = vec3(0.0, -1.0, -1.0);
          vec3 p = vec3(0.0);
          vec3 d = vec3(
            (FC - 0.5 * r) / r.x * 0.4 + vec2(0.0, 0.85),
            0.5
          );

          for (int i = 0; i < 67; i++) {
            color += hsv(0.1, e, min(e * s, 1.0) / 64.0);
            s = 3.0;
            p = q += d * e * R * 0.5 + 1e-4;
            R = max(length(p), 1e-4);
            p = vec3(
              log(R) - t * 0.3,
              exp(-p.z / R) + 0.2,
              atan(p.y, p.x)
            );

            p.y -= 1.0;
            e = p.y;
            for (; s < 1e3; s += s) {
              e += sin(dot(cos(p.zyy * s), 0.5 + cos(p.xxz * s))) / s * 0.3;
            }
          }

          return color;
        }

        vec3 mountainField(vec2 FC, vec2 r, float t) {
          vec3 color = vec3(0.0);
          float s = 0.0;
          float a = 0.0;
          float g = 0.0;

          for (int i = 1; i <= 99; i++) {
            vec3 p = vec3((FC.xy - r) / r * g + 3.0, g);
            p.zx = p.zx * rotate2D(a);

            float e = p.y;
            float h = e;

            for (a = 0.8; a > 0.01; a *= 0.8) {
              p.xz = p.xz * rotate2D(4.0);
              e -= exp(sin(p.z / a + t) - 3.0) * a;
              h += abs(dot(sin(p.zx / a * 0.3) * a, r / r));
            }

            e = min(e, h * 0.4 - 1.0);
            g += e;
            color += 0.01
              - 0.04 / exp(max(s, e) * 8e3) / h
              * hsv(g / float(i) * 0.5, 0.16 * h, 1.0);
          }

          return color;
        }

        void main() {
          vec2 r = u_resolution;
          vec2 FC = gl_FragCoord.xy;
          vec2 uv = FC / r;
          float t = u_time;
          float horizon = 0.38;
          float waterDepth = clamp((horizon - uv.y) / horizon, 0.0, 1.0);

          float waveA = sin(uv.x * 22.0 + uv.y * 38.0 + t * 1.3);
          float waveB = sin(uv.x * 47.0 - uv.y * 72.0 - t * 1.8);
          float waves = waveA * 0.65 + waveB * 0.35;

          vec2 sceneFC = FC;
          if (waterDepth > 0.0) {
            sceneFC.x += waves * r.x * 0.006 * (0.3 + waterDepth);
            sceneFC.y = (
              2.0 * horizon - uv.y + waves * 0.007 * (0.2 + waterDepth)
            ) * r.y;
          }

          vec3 volume = max(volumetricField(sceneFC, r, t), 0.0);
          vec3 mountains = max(mountainField(sceneFC, r, t), 0.0);
          vec3 scene = 1.0 - exp(-(volume + mountains * 0.82) * 1.25);

          vec3 waterTint = vec3(0.008, 0.045, 0.065);
          vec3 reflection = scene * vec3(0.42, 0.56, 0.62);
          float crest = smoothstep(0.72, 1.0, waves) * (0.25 + waterDepth);
          float horizonGlow = exp(-abs(uv.y - horizon) * 180.0);
          vec3 water = reflection
            + waterTint * (0.8 + waterDepth)
            + vec3(0.34, 0.48, 0.50) * crest * 0.14
            + vec3(1.0, 0.55, 0.16) * horizonGlow * 0.18;

          float waterMask = 1.0 - smoothstep(horizon - 0.006, horizon + 0.012, uv.y);
          scene = mix(scene, water, waterMask);
          scene *= 1.0 - 0.24 * length(uv - 0.5);

          fragColor = vec4(scene, 1.0);
        }
      `;

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const error = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error(error);
        }
        return shader;
      }

      try {
        const program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program));
        }

        gl.useProgram(program);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW
        );

        const position = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

        const resolution = gl.getUniformLocation(program, 'u_resolution');
        const time = gl.getUniformLocation(program, 'u_time');
        let startTime = performance.now();
        let pausedAt = 0;
        let paused = false;

        function resize() {
          const displayWidth = canvas.clientWidth;
          const displayHeight = canvas.clientHeight;
          const displayPixels = Math.max(1, displayWidth * displayHeight);
          const pixelBudget = 320_000;
          const pixelRatio = Math.min(
            window.devicePixelRatio || 1,
            1,
            Math.sqrt(pixelBudget / displayPixels)
          );
          const width = Math.max(1, Math.round(displayWidth * pixelRatio));
          const height = Math.max(1, Math.round(displayHeight * pixelRatio));

          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
            gl.viewport(0, 0, width, height);
          }
        }

        function render(now) {
          resize();
          gl.uniform2f(resolution, canvas.width, canvas.height);
          gl.uniform1f(time, (now - startTime) * 0.001);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          if (!paused) requestAnimationFrame(render);
        }

        document.addEventListener('visibilitychange', () => {
          if (document.hidden && !paused) {
            paused = true;
            pausedAt = performance.now();
          } else if (!document.hidden && paused) {
            startTime += performance.now() - pausedAt;
            paused = false;
            requestAnimationFrame(render);
          }
        });

        requestAnimationFrame(render);
      } catch (error) {
        console.error(error);
        fail('The shader could not be started on this device.');
      }
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turquoise Island</title>
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
  #stage{position:fixed;inset:2px;overflow:hidden;border:1px solid rgba(255,255,255,.9);border-radius:22px;background:#88cee2}
  canvas{display:block;width:100%;height:100%}
  #veil{position:absolute;inset:0;z-index:2;background:#8bd0e2;opacity:1;pointer-events:none;transition:opacity 1.1s ease}
  #veil.ready{opacity:0}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
</script>
</head>
<body>
<main id="stage" aria-label="A looping cinematic flight around a tiny tropical island">
  <div id="veil" aria-hidden="true"></div>
</main>
<script type="module">
import * as THREE from 'three';

const stage=document.querySelector('#stage'),veil=document.querySelector('#veil');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x89cee2);
scene.fog=new THREE.Fog(0x70c8df,38,88);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe7fbff,0x69b99d,2.25));
const sun=new THREE.DirectionalLight(0xfff3c7,3.1);
sun.position.set(-9,18,12);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-13;sun.shadow.camera.right=13;
sun.shadow.camera.top=13;sun.shadow.camera.bottom=-13;sun.shadow.camera.near=1;sun.shadow.camera.far=48;
sun.shadow.bias=-.00035;scene.add(sun);

const sky=new THREE.Mesh(
  new THREE.SphereGeometry(95,32,16),
  new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{top:{value:new THREE.Color(0x7fc6de)},bottom:{value:new THREE.Color(0xc1eef0)}},vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`varying vec3 vP;uniform vec3 top,bottom;void main(){float h=smoothstep(-.15,.55,normalize(vP).y);gl_FragColor=vec4(mix(bottom,top,h),1.);}`})
);scene.add(sky);

const waterUniforms={uTime:{value:0},uCamera:{value:new THREE.Vector3()}};
const water=new THREE.Mesh(
  new THREE.PlaneGeometry(120,120,160,160),
  new THREE.ShaderMaterial({
    uniforms:waterUniforms,side:THREE.DoubleSide,extensions:{derivatives:true},
    vertexShader:`
      uniform float uTime;varying vec3 vWorld;varying float vWave;
      void main(){vec3 p=position;float a=sin(p.x*.43+uTime*.75)+sin(p.y*.51-uTime*.58)+sin((p.x+p.y)*.25+uTime*.4);p.z=a*.025;vWave=a;vec4 w=modelMatrix*vec4(p,1.);vWorld=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;
      }`,
    fragmentShader:`
      precision highp float;uniform float uTime;uniform vec3 uCamera;varying vec3 vWorld;varying float vWave;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
      float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.)),f.x),f.y);}
      float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.03+11.7;a*=.5;}return v;}
      vec2 h2(vec2 p){float n=hash(p);return fract(vec2(n,n*1.2154+0.173));}
      float cells(vec2 p){vec2 i=floor(p),f=fract(p);float d1=9.,d2=9.;for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y));vec2 o=h2(i+g);o=.5+.42*sin(uTime*.22+6.2831*o);float d=length(g+o-f);if(d<d1){d2=d1;d1=d;}else if(d<d2)d2=d;}return d2-d1;}
      void main(){
        float radius=length(vWorld.xz),far=smoothstep(9.,48.,radius);
        float broad=fbm(vWorld.xz*.075+vec2(uTime*.018,-uTime*.012));
        vec3 shallow=vec3(.28,.76,.77),mid=vec3(.035,.57,.72),deep=vec3(.005,.30,.61);
        vec3 col=mix(shallow,mid,smoothstep(4.,27.,radius));
        col=mix(col,deep,smoothstep(30.,58.,radius));
        col+=vec3(.06,.15,.12)*(broad-.42)*(1.-far*.45)+vWave*.004;
        vec2 warp=vec2(noise(vWorld.xz*.055+uTime*.025),noise(vWorld.zx*.047-uTime*.02))-.5;
        float edgeA=cells(vWorld.xz*.125+warp*.7),edgeB=cells(vWorld.xz*.205-warp*.35);
        float lineA=1.-smoothstep(.035,.10,edgeA),lineB=1.-smoothstep(.026,.07,edgeB);
        float caustic=(lineA*.20+lineB*.055)*(1.-far*.58);
        float dx=.011*cos(vWorld.x*.43+uTime*.75)+.013*cos((vWorld.x+vWorld.z)*.25+uTime*.4);
        float dz=.013*cos(vWorld.z*.51-uTime*.58)+.013*cos((vWorld.x+vWorld.z)*.25+uTime*.4);
        vec3 n=normalize(vec3(-dx,1.,-dz)),viewDir=normalize(uCamera-vWorld);
        float fresnel=pow(1.-max(0.,dot(n,viewDir)),3.5);
        float glint=pow(max(0.,sin(vWorld.x*1.45+uTime)*sin(vWorld.z*1.28-uTime*.72)),46.);
        col=mix(col,vec3(.22,.67,.82),fresnel*.34);
        col+=vec3(.88,1.,.96)*(caustic+glint*.42);
        float horizon=smoothstep(40.,66.,distance(vWorld,uCamera));col=mix(col,vec3(.008,.32,.62),horizon*.68);
        gl_FragColor=vec4(col,1.);
      }`
  })
);
water.rotation.x=-Math.PI/2;water.position.y=0;water.receiveShadow=true;scene.add(water);

function islandGeometry(flat=false){
  const seg=96,rings=26,pos=[],colors=[],idx=[];
  const boundary=a=>4.35*(1+.13*Math.sin(a*3+.5)+.085*Math.sin(a*5-1.4)+.055*Math.cos(a*2));
  const sample=(r,a)=>{
    const rr=r*boundary(a),x=Math.cos(a)*rr,z=Math.sin(a)*rr;
    let y=.115+2.05*Math.pow(1-r,2.15)*(1+.13*Math.sin(a*2.2));
    y+=.58*Math.exp(-((x+1.05)**2+(z-.15)**2)*.34)+.22*Math.exp(-((x-1.5)**2+(z+1.0)**2)*.7);
    return[x,flat ? .075 : y,z];
  };
  pos.push(...sample(0,0));colors.push(.94,.75,.23);
  for(let i=1;i<=rings;i++)for(let j=0;j<seg;j++){
    const r=i/rings,a=j/seg*Math.PI*2,[x,y,z]=sample(r,a);pos.push(x,y,z);
    const green=smoothstep(.44,1.25,y)*(1-smoothstep(.78,1,r));
    colors.push(THREE.MathUtils.lerp(1,.23,green),THREE.MathUtils.lerp(.76,.52,green),THREE.MathUtils.lerp(.22,.30,green));
  }
  for(let j=0;j<seg;j++)idx.push(0,1+j,1+(j+1)%seg);
  for(let i=1;i<rings;i++)for(let j=0;j<seg;j++){const a=1+(i-1)*seg+j,b=1+(i-1)*seg+(j+1)%seg,c=1+i*seg+j,d=1+i*seg+(j+1)%seg;idx.push(a,c,b,b,c,d)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.setIndex(idx);g.computeVertexNormals();return g;
}
function smoothstep(a,b,v){v=Math.max(0,Math.min(1,(v-a)/(b-a)));return v*v*(3-2*v)}

const coast=new THREE.Mesh(islandGeometry(true),new THREE.MeshBasicMaterial({color:0xfff6d1}));
coast.scale.set(1.035,1,1.035);coast.position.y=.012;scene.add(coast);
const island=new THREE.Mesh(islandGeometry(),new THREE.MeshStandardMaterial({vertexColors:true,roughness:.84,metalness:0}));
island.castShadow=true;island.receiveShadow=true;scene.add(island);

function palm(x,z,s,lean=0){
  const g=new THREE.Group();g.position.set(x,.45+1.45*Math.max(0,1-Math.hypot(x,z)/4.8),z);g.scale.setScalar(s);g.rotation.z=lean;
  const trunkMat=new THREE.MeshStandardMaterial({color:0x6b382b,roughness:.9,flatShading:true});
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.085,.13,2.55,7),trunkMat);trunk.position.y=1.26;trunk.castShadow=true;g.add(trunk);
  const leafMats=[0x176847,0x26845c,0x3a9a67].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.9,side:THREE.DoubleSide,flatShading:true}));
  for(let k=0;k<9;k++){
    const n=6,verts=[],faces=[];for(let i=0;i<=n;i++){const t=i/n,len=1.4*t,w=.025+.22*Math.sin(Math.PI*t);const y=-.52*t*t+.15*Math.sin(Math.PI*t);verts.push(len,y,-w,len,y,w)}
    for(let i=0;i<n;i++){const q=i*2;faces.push(q,q+2,q+1,q+1,q+2,q+3)}
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(faces);geo.computeVertexNormals();
    const leaf=new THREE.Mesh(geo,leafMats[k%3]);leaf.position.y=2.52;leaf.rotation.y=k/9*Math.PI*2;leaf.rotation.z=-.04+(k%3)*.055;leaf.castShadow=true;g.add(leaf);
  }
  scene.add(g);return g;
}
const palms=[palm(-1.55,.1,1.04,-.055),palm(-.75,-.55,.9,.04),palm(.1,-.2,1.13,-.02),palm(.62,.52,.88,.04),palm(1.2,-.62,.96,.08),palm(-1.1,1.0,.78,-.07),palm(.15,1.15,.76,.03)];

const rockMat=new THREE.MeshStandardMaterial({color:0xe9eceb,roughness:.92,flatShading:false});
function rock(x,y,z,sx,sy,sz,detail=2){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(1,detail),rockMat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.rotation.set(.1,.35,-.08);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
rock(4.25,.73,.2,1.08,1.34,.92,3);rock(5.15,.37,.35,.62,.55,.65,2);rock(4.65,.3,-.68,.55,.43,.6,2);

const chest=new THREE.Group();chest.position.set(2.95,.45,2.05);chest.rotation.y=-.55;
const wood=new THREE.MeshStandardMaterial({color:0x4b271e,roughness:.82}),gold=new THREE.MeshStandardMaterial({color:0xe1a73b,roughness:.36,metalness:.55});
const base=new THREE.Mesh(new THREE.BoxGeometry(.6,.45,.46),wood);base.castShadow=true;chest.add(base);
const lid=new THREE.Mesh(new THREE.BoxGeometry(.62,.22,.48),wood);lid.position.y=.31;lid.rotation.z=-.04;lid.castShadow=true;chest.add(lid);
const lock=new THREE.Mesh(new THREE.BoxGeometry(.09,.16,.035),gold);lock.position.set(0,.07,.25);chest.add(lock);scene.add(chest);

function cloud(x,y,z,s){
  const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1});
  [[0,0,0,1.15,.72,.75],[-.9,-.05,.03,.82,.58,.65],[.87,-.02,0,.9,.64,.68],[.15,.28,.02,.82,.78,.7]].forEach(p=>{const m=new THREE.Mesh(new THREE.SphereGeometry(1,18,12),mat);m.position.set(p[0],p[1],p[2]);m.scale.set(p[3],p[4],p[5]);g.add(m)});
  g.position.set(x,y,z);g.scale.setScalar(s);scene.add(g);return g;
}
const clouds=[cloud(-10.5,9,-6,1.25),cloud(10,10,-8,1.45),cloud(2.5,11.5,12,1.1)];

const sparkGeo=new THREE.BufferGeometry(),sparkPos=[];
for(let i=0;i<90;i++){const a=Math.random()*Math.PI*2,r=6+Math.random()*42;sparkPos.push(Math.cos(a)*r,.16+Math.random()*.05,Math.sin(a)*r)}
sparkGeo.setAttribute('position',new THREE.Float32BufferAttribute(sparkPos,3));
const sparkMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uTime:waterUniforms.uTime},vertexShader:`uniform float uTime;varying float vA;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vA=.35+.65*sin(uTime*1.8+position.x*2.7+position.z);gl_PointSize=(2.5+4.*vA)*(160./-mv.z);gl_Position=projectionMatrix*mv;}`,fragmentShader:`varying float vA;void main(){vec2 p=gl_PointCoord-.5;float star=max(1.-smoothstep(.02,.12,abs(p.x)),1.-smoothstep(.02,.12,abs(p.y)));float core=1.-smoothstep(0.,.13,length(p));gl_FragColor=vec4(vec3(1.,.98,.82),max(star*.38,core)*vA);}`});
scene.add(new THREE.Points(sparkGeo,sparkMat));

const path=new THREE.CatmullRomCurve3([
  new THREE.Vector3(7.8,3.1,18.5),new THREE.Vector3(5.8,3.15,13),new THREE.Vector3(3.2,3.45,9.0),
  new THREE.Vector3(.5,3.75,6.6),new THREE.Vector3(-2.6,6.2,8.5),new THREE.Vector3(-7.5,15.2,14),
  new THREE.Vector3(-11.5,19.5,6),new THREE.Vector3(-10.5,20,-4),new THREE.Vector3(-8.5,18.5,-11.5),
  new THREE.Vector3(-4.0,10,-15),new THREE.Vector3(0,2.65,-19)
],false,'catmullrom',.45);
const targetPath=new THREE.CatmullRomCurve3([new THREE.Vector3(0,.78,0),new THREE.Vector3(-.2,.9,.1),new THREE.Vector3(0,.68,0)],false);
const duration=13.05,clock=new THREE.Clock();
camera.position.copy(path.getPoint(0));camera.lookAt(0,.78,0);
function animate(){
  requestAnimationFrame(animate);const raw=clock.getElapsedTime(),cycle=raw%(duration+1.15),t=Math.min(cycle,duration)/duration;
  camera.position.copy(path.getPoint(t));camera.lookAt(targetPath.getPoint(Math.min(.999,t)));
  const fade=cycle>duration?Math.min(1,(cycle-duration)/.4):cycle<.45?1-cycle/.45:0;veil.style.opacity=fade;
  waterUniforms.uTime.value=raw;waterUniforms.uCamera.value.copy(camera.position);
  palms.forEach((p,i)=>p.rotation.x=Math.sin(raw*.65+i*.8)*.012);
  clouds.forEach((c,i)=>{c.position.x+=Math.sin(raw*.18+i)*.0007;c.rotation.y=Math.sin(raw*.08+i)*.04});
  renderer.render(scene,camera);
}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}
addEventListener('resize',resize);resize();
renderer.compileAsync(scene,camera).finally(()=>{veil.classList.add('ready');clock.start();animate()});
</script>
</body>
</html>

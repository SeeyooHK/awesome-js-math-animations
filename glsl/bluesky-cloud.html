<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blue Sky Clouds</title>
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #message {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 2rem;
      color: #f7c77a;
      font: 500 0.95rem/1.5 system-ui, sans-serif;
      text-align: center;
      background: #080400;
    }
  </style>
</head>
<body>
  <canvas id="gl-canvas" aria-label="Blue sky with softly floating clouds"></canvas>
  <div id="message" role="alert"></div>

  <script>
    (() => {
      const canvas = document.querySelector('#gl-canvas');
      const message = document.querySelector('#message');
      const gl = canvas.getContext('webgl2', {
        alpha: false,
        antialias: false,
        depth: false,
        powerPreference: 'high-performance'
      });

      const fail = (text) => {
        canvas.hidden = true;
        message.style.display = 'grid';
        message.textContent = text;
      };

      if (!gl) {
        fail('This animation needs a browser with WebGL 2 support.');
        return;
      }

      const vertexSource = `#version 300 es
        in vec2 a_position;

        void main() {
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fragmentSource = `#version 300 es
        precision highp float;

        uniform vec2 u_resolution;
        uniform float u_time;
        out vec4 fragColor;

        float hash21(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        float noise2D(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);

          return mix(
            mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
            mix(hash21(i + vec2(0.0, 1.0)), hash21(i + 1.0), f.x),
            f.y
          );
        }

        float fbm(vec2 p) {
          float value = 0.0;
          float amplitude = 0.5;
          mat2 octaveRotation = mat2(0.8, -0.6, 0.6, 0.8);

          for (int i = 0; i < 6; i++) {
            value += noise2D(p) * amplitude;
            p = octaveRotation * p * 2.03 + 17.17;
            amplitude *= 0.5;
          }

          return value;
        }

        void main() {
          vec2 r = u_resolution;
          vec2 FC = gl_FragCoord.xy;
          float t = u_time;
          vec2 uv = FC.xy / r;
          vec2 p = vec2((uv.x - 0.5) * r.x / r.y, uv.y);
          vec2 wind = vec2(t * 0.025, sin(t * 0.035) * 0.08);

          vec3 skyLow = vec3(0.42, 0.72, 0.96);
          vec3 skyHigh = vec3(0.035, 0.24, 0.62);
          vec3 sky = mix(skyLow, skyHigh, smoothstep(0.0, 1.0, uv.y));

          float farShape = fbm(p * 2.7 + wind * 0.55 + vec2(4.7, 1.3));
          float farClouds = smoothstep(0.54, 0.68, farShape) * 0.35;
          sky = mix(sky, vec3(0.82, 0.88, 0.94), farClouds);

          vec2 cloudP = p * 1.75 + wind;
          vec2 warp = vec2(
            fbm(cloudP * 0.72 + vec2(2.1, 7.4)),
            fbm(cloudP * 0.72 + vec2(8.3, 2.8))
          );
          float largeShapes = fbm(cloudP + warp * 0.82);
          float softDetail = fbm(cloudP * 3.1 - wind * 0.35 + warp * 0.25);
          float density = largeShapes * 0.82 + softDetail * 0.18;

          float altitudeMask = smoothstep(0.06, 0.18, uv.y)
            * (1.0 - smoothstep(0.86, 1.04, uv.y));
          float cloudBody = smoothstep(0.49, 0.65, density) * altitudeMask;
          float cloudWisps = smoothstep(0.43, 0.54, density)
            * altitudeMask * 0.28;
          float cloudAlpha = clamp(cloudBody * 0.9 + cloudWisps, 0.0, 0.96);

          float coreLight = smoothstep(0.5, 0.72, density);
          vec3 cloudShadow = vec3(0.55, 0.64, 0.74);
          vec3 cloudLight = vec3(1.0, 0.985, 0.94);
          vec3 cloudColor = mix(cloudShadow, cloudLight, coreLight);

          float silverLining = smoothstep(0.47, 0.52, density)
            * (1.0 - smoothstep(0.52, 0.58, density));
          cloudColor += vec3(1.0, 0.9, 0.7) * silverLining * 0.12;
          sky = mix(sky, cloudColor, cloudAlpha);

          float haze = pow(1.0 - uv.y, 3.0);
          sky += vec3(0.16, 0.22, 0.25) * haze;
          fragColor = vec4(sky, 1.0);
        }
      `;

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const error = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error(error);
        }
        return shader;
      }

      try {
        const program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program));
        }

        gl.useProgram(program);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW
        );

        const position = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

        const resolution = gl.getUniformLocation(program, 'u_resolution');
        const time = gl.getUniformLocation(program, 'u_time');
        let startTime = performance.now();
        let pausedAt = 0;
        let paused = false;

        function resize() {
          const displayWidth = canvas.clientWidth;
          const displayHeight = canvas.clientHeight;
          const displayPixels = Math.max(1, displayWidth * displayHeight);
          const pixelBudget = 1_250_000;
          const pixelRatio = Math.min(
            window.devicePixelRatio || 1,
            1,
            Math.sqrt(pixelBudget / displayPixels)
          );
          const width = Math.max(1, Math.round(displayWidth * pixelRatio));
          const height = Math.max(1, Math.round(displayHeight * pixelRatio));

          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
            gl.viewport(0, 0, width, height);
          }
        }

        function render(now) {
          resize();
          gl.uniform2f(resolution, canvas.width, canvas.height);
          gl.uniform1f(time, (now - startTime) * 0.001);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          if (!paused) requestAnimationFrame(render);
        }

        document.addEventListener('visibilitychange', () => {
          if (document.hidden && !paused) {
            paused = true;
            pausedAt = performance.now();
          } else if (!document.hidden && paused) {
            startTime += performance.now() - pausedAt;
            paused = false;
            requestAnimationFrame(render);
          }
        });

        requestAnimationFrame(render);
      } catch (error) {
        console.error(error);
        fail('The shader could not be started on this device.');
      }
    })();
  </script>
</body>
</html>

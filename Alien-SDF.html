<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDF Cyclops</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #ef6543; }
    canvas { display: block; width: 100%; height: 100%; }
    #error { color: white; font: 16px/1.5 system-ui; padding: 2rem; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const uniforms = {
      uResolution: { value: new THREE.Vector2() },
      uTime: { value: 0 },
      uPointer: { value: new THREE.Vector2(0.75, 0.3) }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      depthTest: false,
      depthWrite: false,
      vertexShader: `
        void main() {
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;

        uniform vec2 uResolution;
        uniform float uTime;
        uniform vec2 uPointer;

        #define MAX_STEPS 120
        #define FAR 12.0
        #define EPSILON 0.001

        float gMagnetMix = 0.0;

        mat2 rotate2(float a) {
          float c = cos(a), s = sin(a);
          return mat2(c, -s, s, c);
        }

        float sdSphere(vec3 p, float r) {
          return length(p) - r;
        }

        float sdEllipsoid(vec3 p, vec3 r) {
          float k0 = length(p / r);
          float k1 = length(p / (r * r));
          return k0 * (k0 - 1.0) / k1;
        }

        float sdRoundBox(vec3 p, vec3 b, float r) {
          vec3 q = abs(p) - b + r;
          return min(max(q.x, max(q.y, q.z)), 0.0) + length(max(q, 0.0)) - r;
        }

        float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
          vec3 pa = p - a, ba = b - a;
          float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
          return length(pa - ba * h) - r;
        }

        float sdCone(vec3 p, vec2 c, float h) {
          vec2 q = h * vec2(c.x / c.y, -1.0);
          vec2 w = vec2(length(p.xz), p.y);
          vec2 a = w - q * clamp(dot(w, q) / dot(q, q), 0.0, 1.0);
          vec2 b = w - q * vec2(clamp(w.x / q.x, 0.0, 1.0), 1.0);
          float k = sign(q.y);
          float d = min(dot(a, a), dot(b, b));
          float s = max(k * (w.x * q.y - w.y * q.x), k * (w.y - q.y));
          return sqrt(d) * sign(s);
        }

        vec2 unite(vec2 a, vec2 b) {
          return a.x < b.x ? a : b;
        }

        float smoothUnion(float a, float b, float radius) {
          float h = clamp(0.5 + 0.5 * (b - a) / radius, 0.0, 1.0);
          return mix(b, a, h) - radius * h * (1.0 - h);
        }

        vec3 ballPosition() {
          return vec3(
            clamp(uPointer.x * 1.78, -2.25, 2.25),
            clamp(0.12 + uPointer.y * 1.78, -1.05, 1.72),
            0.50
          );
        }

        vec2 sceneSDF(vec3 p) {
          vec2 ground = vec2(p.y + 1.32, 8.0);
          vec2 result = vec2(FAR, -1.0);

          // Gently tapered, rounded rectangular body.
          vec3 bodyP = p - vec3(0.0, 0.28, 0.0);
          bodyP.x /= 1.0 - 0.075 * bodyP.y;
          float body = sdRoundBox(bodyP, vec3(0.79, 1.03, 0.43), 0.27);
          result = unite(result, vec2(body, 1.0));

          // Stubby legs and boot-like feet.
          vec3 leftLeg = p - vec3(-0.38, -0.94, 0.03);
          vec3 rightLeg = p - vec3(0.38, -0.94, 0.03);
          result = unite(result, vec2(sdCapsule(leftLeg, vec3(0.0, -0.18, 0.0), vec3(0.0, 0.22, 0.0), 0.20), 1.0));
          result = unite(result, vec2(sdCapsule(rightLeg, vec3(0.0, -0.18, 0.0), vec3(0.0, 0.22, 0.0), 0.20), 1.0));
          result = unite(result, vec2(sdEllipsoid(p - vec3(-0.38, -1.15, 0.15), vec3(0.27, 0.16, 0.32)), 1.0));
          result = unite(result, vec2(sdEllipsoid(p - vec3(0.38, -1.15, 0.15), vec3(0.27, 0.16, 0.32)), 1.0));

          // Long drooping arms, slightly in front of the body.
          vec3 armL = p - vec3(-0.82, -0.05, 0.02);
          vec3 armR = p - vec3(0.82, -0.05, 0.02);
          armL.xy = rotate2(-0.08) * armL.xy;
          armR.xy = rotate2(0.08) * armR.xy;
          result = unite(result, vec2(sdEllipsoid(armL, vec3(0.20, 0.73, 0.30)), 1.0));
          result = unite(result, vec2(sdEllipsoid(armR, vec3(0.20, 0.73, 0.30)), 1.0));

          // Coral horns, leaned outward.
          vec3 hornL = p - vec3(-0.62, 1.36, 0.0);
          vec3 hornR = p - vec3(0.62, 1.36, 0.0);
          hornL.xy = rotate2(-0.43) * hornL.xy;
          hornR.xy = rotate2(0.43) * hornR.xy;
          result = unite(result, vec2(sdCone(hornL, vec2(0.18, 0.36), 0.46), 2.0));
          result = unite(result, vec2(sdCone(hornR, vec2(0.18, 0.36), 0.46), 2.0));
          vec2 character = result;

          // Layered eye; pupil tracks the flying ball.
          vec3 ball = ballPosition();
          vec2 glance = clamp((ball.xy - vec2(0.0, 0.72)) * 0.055, vec2(-0.10), vec2(0.10));
          result = unite(result, vec2(sdEllipsoid(p - vec3(0.0, 0.72, 0.45), vec3(0.54, 0.59, 0.28)), 3.0));
          result = unite(result, vec2(sdEllipsoid(p - vec3(glance.x, 0.72 + glance.y, 0.704), vec3(0.305, 0.335, 0.075)), 4.0));
          result = unite(result, vec2(sdEllipsoid(p - vec3(glance.x, 0.72 + glance.y, 0.760), vec3(0.145, 0.200, 0.050)), 5.0));
          result = unite(result, vec2(sdSphere(p - vec3(glance.x - 0.065, 0.82 + glance.y, 0.810), 0.055), 3.0));
          result = unite(result, vec2(sdSphere(p - vec3(glance.x + 0.055, 0.66 + glance.y, 0.805), 0.025), 3.0));

          // Mouth, tongue and two tiny teeth sit on the body's front surface.
          vec3 mouthP = p - vec3(0.0, -0.10, 0.470);
          result = unite(result, vec2(sdEllipsoid(mouthP, vec3(0.37, 0.19, 0.075)), 6.0));
          result = unite(result, vec2(sdEllipsoid(p - vec3(0.0, -0.205, 0.536), vec3(0.18, 0.065, 0.035)), 2.0));
          result = unite(result, vec2(sdRoundBox(p - vec3(-0.18, -0.015, 0.550), vec3(0.075, 0.080, 0.025), 0.025), 3.0));
          result = unite(result, vec2(sdRoundBox(p - vec3(0.18, -0.015, 0.550), vec3(0.075, 0.080, 0.025), 0.025), 3.0));

          // A wide smooth-min makes the pointer sphere pull a liquid bridge
          // from the alien instead of merely intersecting its surface.
          float alienDistance = character.x;
          float ballDistance = sdSphere(p - ball, 0.34);
          gMagnetMix = smoothstep(-0.255, 0.255, alienDistance - ballDistance);
          float mergedDistance = smoothUnion(alienDistance, ballDistance, 0.60);
          float mergedMaterial = ballDistance < alienDistance ? 7.0 : character.y;
          result = unite(result, vec2(mergedDistance, mergedMaterial));

          return unite(ground, result);
        }

        vec2 raymarch(vec3 ro, vec3 rd) {
          float distanceTravelled = 0.0;
          float materialId = -1.0;
          for (int i = 0; i < MAX_STEPS; i++) {
            vec2 hit = sceneSDF(ro + rd * distanceTravelled);
            if (hit.x < EPSILON * max(1.0, distanceTravelled) || distanceTravelled > FAR) {
              materialId = hit.y;
              break;
            }
            distanceTravelled += hit.x * 0.78;
          }
          if (distanceTravelled > FAR) materialId = -1.0;
          return vec2(distanceTravelled, materialId);
        }

        vec3 normalAt(vec3 p) {
          vec2 e = vec2(EPSILON, 0.0);
          return normalize(vec3(
            sceneSDF(p + e.xyy).x - sceneSDF(p - e.xyy).x,
            sceneSDF(p + e.yxy).x - sceneSDF(p - e.yxy).x,
            sceneSDF(p + e.yyx).x - sceneSDF(p - e.yyx).x
          ));
        }

        float ambientOcclusion(vec3 p, vec3 n) {
          float occlusion = 0.0;
          float weight = 1.0;
          for (int i = 1; i <= 5; i++) {
            float distance = 0.035 * float(i);
            occlusion += (distance - sceneSDF(p + n * distance).x) * weight;
            weight *= 0.62;
          }
          return clamp(1.0 - occlusion * 2.4, 0.0, 1.0);
        }

        float softShadow(vec3 ro, vec3 rd, float maxDistance) {
          float shadow = 1.0;
          float travelled = 0.035;
          for (int i = 0; i < 44; i++) {
            float h = sceneSDF(ro + rd * travelled).x;
            shadow = min(shadow, 14.0 * h / travelled);
            travelled += clamp(h, 0.025, 0.20);
            if (h < 0.0005 || travelled > maxDistance) break;
          }
          return clamp(shadow, 0.18, 1.0);
        }

        vec3 baseColour(float id, vec3 p) {
          if (id < 1.5) return vec3(0.20, 0.78, 0.78);
          if (id < 2.5) return vec3(0.96, 0.25, 0.22);
          if (id < 3.5) return vec3(0.96, 0.93, 0.79);
          if (id < 4.5) return vec3(0.36, 0.20, 0.09);
          if (id < 5.5) return vec3(0.025, 0.018, 0.012);
          if (id < 6.5) return vec3(0.045, 0.018, 0.018);
          if (id < 7.5) return vec3(0.25, 0.12, 0.52);
          return vec3(0.88, 0.29, 0.20);
        }

        void main() {
          vec2 pixel = (2.0 * gl_FragCoord.xy - uResolution.xy) / uResolution.y;

          float t = mod(uTime, 12.0);
          float breathe = 0.025 * sin(t * 2.1);
          vec3 ro = vec3(0.0, 0.12 + breathe, 5.0);
          vec3 target = vec3(0.0, 0.12, 0.0);
          vec3 forward = normalize(target - ro);
          vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
          vec3 up = cross(right, forward);
          vec3 rd = normalize(forward * 2.35 + right * pixel.x + up * pixel.y);

          vec2 hit = raymarch(ro, rd);
          vec3 colour;

          if (hit.y < 0.0) {
            float glow = 1.0 - 0.08 * length(pixel - vec2(-0.35, 0.45));
            colour = vec3(0.95, 0.31, 0.21) * glow;
          } else {
            vec3 p = ro + rd * hit.x;
            vec3 n = normalAt(p);
            vec3 lightPosition = vec3(-3.2, 4.8, 4.0);
            vec3 toLight = lightPosition - p;
            float lightDistance = length(toLight);
            vec3 l = toLight / lightDistance;
            vec3 v = normalize(ro - p);
            vec3 h = normalize(l + v);
            float diffuse = max(dot(n, l), 0.0);
            float shadow = softShadow(p + n * 0.006, l, lightDistance);
            float ao = ambientOcclusion(p, n);
            float rim = pow(1.0 - max(dot(n, v), 0.0), 3.0);
            float gloss = hit.y == 8.0 ? 18.0 : 70.0;
            float specular = pow(max(dot(n, h), 0.0), gloss) * shadow;

            // Shadow and AO probes also call sceneSDF, so sample the hit once
            // more to recover the material blend at this exact surface point.
            sceneSDF(p);
            float magnetMix = hit.y == 8.0 ? 0.0 : gMagnetMix;
            vec3 albedo = mix(baseColour(hit.y, p), vec3(0.25, 0.12, 0.52), magnetMix);
            vec3 warmLight = vec3(1.0, 0.80, 0.67);
            colour = albedo * (0.22 * ao + 0.88 * diffuse * shadow * warmLight);
            colour += specular * vec3(1.0, 0.91, 0.82) * (hit.y == 8.0 ? 0.10 : 0.72);
            colour += rim * albedo * 0.22;

            if (hit.y == 8.0) {
              float vignette = 1.0 - smoothstep(1.6, 4.6, length(p.xz));
              colour *= 0.78 + 0.22 * vignette;
            }
          }

          colour = colour / (colour + vec3(0.72));
          colour = pow(colour, vec3(0.4545));
          float vignette = 1.0 - 0.16 * dot(pixel * 0.55, pixel * 0.55);
          gl_FragColor = vec4(colour * vignette, 1.0);
        }
      `
    });

    const scene = new THREE.Scene();
    const camera = new THREE.Camera();
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clock = new THREE.Clock();
    const pointerTarget = uniforms.uPointer.value.clone();

    function trackPointer(event) {
      pointerTarget.set(
        (2.0 * event.clientX - innerWidth) / innerHeight,
        (innerHeight - 2.0 * event.clientY) / innerHeight
      );
    }

    function resize() {
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
      renderer.setSize(innerWidth, innerHeight);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
    }

    function animate() {
      uniforms.uTime.value = reducedMotion ? 1.5 : clock.getElapsedTime();
      uniforms.uPointer.value.lerp(pointerTarget, reducedMotion ? 1.0 : 0.14);
      renderer.render(scene, camera);
      if (!reducedMotion) requestAnimationFrame(animate);
    }

    addEventListener('resize', resize);
    addEventListener('pointermove', trackPointer, { passive: true });
    addEventListener('pointerdown', trackPointer, { passive: true });
    resize();
    animate();
  </script>
</body>
</html>

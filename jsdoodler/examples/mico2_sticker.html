<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mico2 Sticker — Three.js Doodle</title>
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f3eee2}canvas{display:block;width:100%;height:100%;cursor:default}</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js';

// Three.js-first doodle renderer. Mark behavior is inspired by cyber-crowd,
// copyright (c) 2026 Kevin, MIT. No Canvas 2D drawing is used.
const SIZE=1000, SEED=1832793577, PAPER=0xf3eee2, INK=0x272936;
let state=SEED>>>0;
const rnd=()=>((state=(Math.imul(state,1664525)+1013904223)>>>0)/4294967296);
const rr=(a,b)=>a+rnd()*(b-a);
const scene=new THREE.Scene(); scene.background=new THREE.Color(PAPER);
const camera=new THREE.OrthographicCamera(-500,500,500,-500,.1,100);
camera.position.z=12;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const paper=new THREE.Mesh(new THREE.PlaneGeometry(4000,2400),new THREE.ShaderMaterial({
  uniforms:{base:{value:new THREE.Color(PAPER)},resolution:{value:new THREE.Vector2(innerWidth,innerHeight)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec2 vUv;uniform vec3 base;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}void main(){vec2 p=vUv*vec2(1700.,1000.);float tooth=(hash(floor(p))-.5)*.032;float fiber=sin(p.x*.075+sin(p.y*.021)*2.)*.008+sin(p.y*.11)*.004;gl_FragColor=vec4(base+tooth+fiber,1.);}`,
  depthWrite:false
}));
paper.position.z=-5;scene.add(paper);
const doodle=new THREE.Group();scene.add(doodle);
const V=(p,z=0)=>new THREE.Vector3(p[0]-SIZE/2,SIZE/2-p[1],z);
const material=(color=INK,opacity=.86)=>new THREE.MeshBasicMaterial({color,transparent:opacity<1,opacity,side:THREE.DoubleSide,depthWrite:false});

function resample(points,step=4){const out=[points[0].slice()];let need=step;for(let i=1;i<points.length;i++){let [x,y]=points[i-1],q=points[i],d=Math.hypot(q[0]-x,q[1]-y);while(d>=need&&d){const t=need/d;x+=(q[0]-x)*t;y+=(q[1]-y)*t;out.push([x,y]);d=Math.hypot(q[0]-x,q[1]-y);need=step}need-=d}if(out.length===1)out.push(points.at(-1).slice());return out}
function smooth(points,closed=false,passes=1){let pts=points.map(p=>p.slice());while(passes--){const out=[];if(!closed)out.push(pts[0]);for(let i=0;i<(closed?pts.length:pts.length-1);i++){const a=pts[i],b=pts[(i+1)%pts.length];out.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}if(!closed)out.push(pts.at(-1));pts=out}return pts}
function inside(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++)if(((poly[i][1]>p[1])!==(poly[j][1]>p[1]))&&(p[0]<(poly[j][0]-poly[i][0])*(p[1]-poly[i][1])/(poly[j][1]-poly[i][1])+poly[i][0]))c=!c;return c}
function bounds(poly){return poly.reduce((b,p)=>[Math.min(b[0],p[0]),Math.min(b[1],p[1]),Math.max(b[2],p[0]),Math.max(b[3],p[1])],[Infinity,Infinity,-Infinity,-Infinity])}

function fill(points,color=PAPER,opacity=1,z=.01,parent=doodle){
  const s=new THREE.Shape();const a=V(points[0]);s.moveTo(a.x,a.y);for(let i=1;i<points.length;i++){const p=V(points[i]);s.lineTo(p.x,p.y)}s.closePath();
  const mesh=new THREE.Mesh(new THREE.ShapeGeometry(s),material(color,opacity));mesh.position.z=z;parent.add(mesh);return mesh;
}
function ribbon(points,width=3,o={},parent=doodle){
  const pts=resample(points,Math.max(2,width*.8)).map(V),verts=[],indices=[],phase=rr(0,7),amp=o.amp??(width*.42+.45);
  for(let i=0;i<pts.length;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)],nx=-(b.y-a.y),ny=b.x-a.x,d=Math.hypot(nx,ny)||1,t=i/(pts.length-1||1);
    const wob=(Math.sin(t*13+phase)*.68+Math.sin(t*31+phase*1.9)*.32)*amp;
    const cx=pts[i].x+nx/d*wob+rr(-.22,.22),cy=pts[i].y+ny/d*wob+rr(-.22,.22);
    const taper=o.taper===false?1:(.28+.72*Math.sin(Math.PI*Math.max(.02,Math.min(.98,t))));
    const half=width*.5*taper*rr(.88,1.12),ox=nx/d*half,oy=ny/d*half;
    verts.push(cx+ox,cy+oy,o.z??.1,cx-ox,cy-oy,o.z??.1);
    if(i<pts.length-1){const k=i*2;indices.push(k,k+1,k+2,k+1,k+3,k+2)}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(indices);g.computeVertexNormals();
  const mesh=new THREE.Mesh(g,material(o.color??INK,o.alpha??.84));parent.add(mesh);return mesh;
}
function stroke(points,width=3,o={},parent=doodle){
  const group=new THREE.Group();parent.add(group);ribbon(points,width,o,group);
  if(o.ghost)ribbon(points,width*.55,{...o,alpha:(o.alpha??.84)*.2,amp:(o.amp??width)*1.8,z:(o.z??.1)-.01},group);
  if(width>1.5){const pts=resample(points,width*2),positions=[];for(const p of pts)if(rnd()>.45){const q=V([p[0]+rr(-width,width),p[1]+rr(-width,width)],(o.z??.1)+.01);positions.push(q.x,q.y,q.z)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));group.add(new THREE.Points(g,new THREE.PointsMaterial({color:o.color??INK,size:rr(.7,1.5),transparent:true,opacity:(o.alpha??.84)*.3,sizeAttenuation:false})))}return group;
}
function broken(points,width=2,o={},parent=doodle){const pts=resample(points,3),group=new THREE.Group();parent.add(group);for(let i=0;i<3;i++){const a=Math.max(0,Math.floor(i*pts.length/3)-1),b=Math.min(pts.length,Math.ceil((i+1)*pts.length/3)+1);if(rnd()>.16)stroke(pts.slice(a,b),width*rr(.72,1.18),{...o,alpha:(o.alpha??.72)*rr(.64,1)},group)}return group}
function segmentHits(poly,p,d){const hits=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],e=[b[0]-a[0],b[1]-a[1]],den=d[0]*e[1]-d[1]*e[0];if(Math.abs(den)<1e-6)continue;const ap=[a[0]-p[0],a[1]-p[1]],t=(ap[0]*e[1]-ap[1]*e[0])/den,u=(ap[0]*d[1]-ap[1]*d[0])/den;if(u>=0&&u<=1)hits.push(t)}return hits.sort((a,b)=>a-b)}
function hatch(poly,spacing=12,angle=-.7,alpha=.28,parent=doodle){const [x0,y0,x1,y1]=bounds(poly),diag=Math.hypot(x1-x0,y1-y0),c=[(x0+x1)/2,(y0+y1)/2],d=[Math.cos(angle),Math.sin(angle)],n=[-d[1],d[0]],group=new THREE.Group();parent.add(group);for(let off=-diag;off<diag;off+=spacing*rr(.88,1.12)){const p=[c[0]+n[0]*off,c[1]+n[1]*off],hits=segmentHits(poly,p,d);for(let i=0;i+1<hits.length;i+=2)broken([[p[0]+d[0]*hits[i],p[1]+d[1]*hits[i]],[p[0]+d[0]*hits[i+1],p[1]+d[1]*hits[i+1]]],rr(.7,1.25),{alpha},group)}return group}
function stipple(poly,spacing=8,alpha=.36,parent=doodle){const [x0,y0,x1,y1]=bounds(poly),positions=[],count=(x1-x0)*(y1-y0)/(spacing*spacing);for(let i=0;i<count;i++){const p=[rr(x0,x1),rr(y0,y1)];if(inside(p,poly)){const q=V(p,.2);positions.push(q.x,q.y,q.z)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));const cloud=new THREE.Points(g,new THREE.PointsMaterial({color:INK,size:rr(.8,1.8),transparent:true,opacity:alpha,sizeAttenuation:false}));parent.add(cloud);return cloud}
function scribble(poly,spacing=10,alpha=.26,parent=doodle){const [x0,y0,x1,y1]=bounds(poly),group=new THREE.Group();parent.add(group);for(let y=y0;y<=y1;y+=spacing*rr(.82,1.18)){let run=[];for(let x=x0;x<=x1;x+=6){const p=[x,y+Math.sin(x*.055+y)*spacing*.42+rr(-1.2,1.2)];if(inside(p,poly))run.push(p);else if(run.length>1){broken(run,rr(.65,1.35),{alpha},group);run=[]}}if(run.length>1)broken(run,rr(.65,1.35),{alpha},group)}return group}

// ======================= CHARACTER DOODLE =======================
function drawDoodle(){
  const oval=(cx,cy,rx,ry,n=30,rot=0)=>Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2,x=Math.cos(a)*rx,y=Math.sin(a)*ry;return[cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)]});
  const close=points=>[...points,points[0]];
  const yellow=0xf2cf47,cream=0xf1e7b8,gold=0xd9aa2f,orange=0xe87832,rust=0xb84f31,plum=0x4b3542;

  // A loose egg-body, intentionally slimmer and more tilted than the sticker.
  const body=smooth(oval(500,525,297,329,34,-.045),true,2);
  fill(body,yellow,.72,.01);
  stroke(close(body),7,{color:plum,alpha:.9,z:.18,ghost:true});
  hatch(body,29,-.72,.075);

  // Tiny, uneven wings give the doodle a stubborn hands-on-hips stance.
  const leftWing=smooth([[232,455],[184,480],[160,536],[166,610],[202,646],[239,623],[252,564],[248,501]],true,2);
  const rightWing=smooth([[757,478],[802,496],[830,545],[826,608],[798,636],[765,616],[749,564]],true,2);
  fill(leftWing,gold,.66,.04);fill(rightWing,gold,.66,.04);
  stroke(close(leftWing),5,{color:plum,alpha:.84,z:.2,ghost:true});
  stroke(close(rightWing),5,{color:plum,alpha:.84,z:.2,ghost:true});

  // One continuous, exaggerated three-lobed forelock instead of copied hair cells.
  const tuft=smooth([[323,296],[291,253],[304,198],[344,169],[394,180],[429,216],[426,171],[461,123],[505,112],[542,143],[561,198],[578,164],[625,148],[677,174],[708,221],[701,267],[666,298],[611,293],[551,273],[500,302],[444,276],[387,297]],true,2);
  fill(tuft,yellow,.78,.08);
  stroke(close(tuft),7,{color:plum,alpha:.9,z:.24,ghost:true});
  broken([[357,278],[375,230],[404,199]],3,{color:plum,alpha:.38,z:.27});
  broken([[486,279],[493,226],[500,163]],3,{color:plum,alpha:.4,z:.27});
  broken([[628,275],[615,224],[592,186]],3,{color:plum,alpha:.38,z:.27});

  // Quiet face wash keeps the huge eyes readable without copying the sticker finish.
  const face=smooth(oval(502,443,218,214,30,.015),true,2);
  fill(face,cream,.72,.09);
  broken(close(face),4,{color:plum,alpha:.6,z:.25,ghost:true});

  // Oversized suspicious eyes: the character's strongest feature gets exaggerated.
  const eye=(cx,cy,look)=>{
    const rim=smooth(oval(cx,cy,102,111,28),true,1);
    const white=smooth(oval(cx,cy+3,77,84,26),true,1);
    const pupil=smooth(oval(cx+look,cy+8,49,59,24),true,1);
    fill(rim,gold,.58,.18);stroke(close(rim),5,{color:plum,alpha:.88,z:.3,ghost:true});
    fill(white,0xf8f0d8,.92,.2);broken(close(white),3,{color:plum,alpha:.62,z:.31});
    fill(pupil,plum,.94,.23);
    fill(oval(cx+look-17,cy-17,12,16,16),0xfff8df,.95,.28);
    fill(oval(cx+look+16,cy+34,6,8,14),yellow,.9,.28);
  };
  eye(378,438,-5);eye(623,431,7);

  // Slashing brows and a wonky I-shaped bridge carry the grumpy expression.
  stroke([[294,338],[351,363],[417,395]],13,{color:plum,alpha:.94,z:.36,taper:false,ghost:true});
  stroke([[704,328],[650,357],[584,394]],13,{color:plum,alpha:.94,z:.36,taper:false,ghost:true});
  const bridge=[[479,279],[528,278],[529,301],[515,302],[517,426],[545,426],[544,452],[462,454],[461,429],[489,428],[487,302],[477,302]];
  fill(bridge,yellow,.82,.31);stroke(close(bridge),5,{color:plum,alpha:.9,z:.38,ghost:true});

  // Broad, flattened beak with a separate scribbled lower lip.
  const topBeak=smooth([[501,472],[468,485],[438,518],[396,555],[382,579],[396,594],[444,584],[500,563],[554,581],[604,591],[619,575],[602,548],[560,513],[532,484]],true,1);
  fill(topBeak,orange,.82,.33);stroke(close(topBeak),7,{color:plum,alpha:.92,z:.42,ghost:true});
  const lowerBeak=smooth([[405,590],[452,578],[500,574],[550,580],[597,593],[558,621],[501,631],[445,619]],true,1);
  fill(lowerBeak,rust,.72,.34);broken(close(lowerBeak),5,{color:plum,alpha:.76,z:.43,ghost:true});

  // Stub feet are deliberately mismatched to break the sticker-perfect symmetry.
  const leftFoot=smooth([[348,785],[438,786],[477,799],[458,849],[410,871],[337,860],[316,829]],true,2);
  const rightFoot=smooth([[522,798],[570,786],[654,793],[683,825],[663,859],[590,872],[544,850]],true,2);
  fill(leftFoot,yellow,.7,.05);fill(rightFoot,yellow,.7,.05);
  stroke(close(leftFoot),5,{color:plum,alpha:.82,z:.22,ghost:true});
  stroke(close(rightFoot),5,{color:plum,alpha:.82,z:.22,ghost:true});

  // A few construction flicks add attitude without recreating the original frame.
  broken([[264,319],[231,294]],3,{color:plum,alpha:.42,z:.3});
  broken([[735,307],[768,275]],3,{color:plum,alpha:.42,z:.3});
  doodle.rotation.z=.035;
}
drawDoodle();
// ===================== END CHARACTER DOODLE ====================

function resize(){const a=innerWidth/innerHeight,h=1080;camera.left=-h*a/2;camera.right=h*a/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);paper.material.uniforms.resolution.value.set(innerWidth,innerHeight);renderer.render(scene,camera)}addEventListener('resize',resize);resize();
</script>
</body>
</html>

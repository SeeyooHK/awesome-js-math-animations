<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>p5.js Sketch</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #090909;
    }

    body {
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script>
    leaf = (x, y, X, Y, phase) => {
      for (let n = 0; n < 72; n++) {
        let v = (n % 24) / 23
        let f = (n / 24 | 0) - 1
        let dx = X - x, dy = Y - y, l = sqrt(dx * dx + dy * dy)
        let bulge = sin(PI * v) * (7 * f + 1.8 * sin(.85 * t + phase + 2.4 * v))
        point(x + dx * v - dy / l * bulge, y + dy * v + dx / l * bulge)
      }
    }

    t = 0, draw = $ => {
      t || createCanvas(w = 520, w)
      background(6, 8, 11)
      t += PI / 240

      let wind = 10 * sin(.8 * t)
      let bob = 1.5 * sin(.55 * t)
      let bend = v => lerp(260 + wind, 250, v) + (4 + 2 * sin(.65 * t + 2.5 * v)) * sin(PI * v)
      let topY = 263 + bob

      push()
      stroke(110, 174, 125, 155)
      strokeWeight(1.4)
      for (let n = 0; n < 255; n++) {
        let v = (n % 85) / 84
        let offset = (n / 85 | 0) - 1
        point(bend(v) + offset * 1.2, lerp(topY, 520, v))
      }
      let y1 = lerp(topY, 520, .55), x1 = bend(.55)
      let y2 = lerp(topY, 520, .73), x2 = bend(.73)
      leaf(x1, y1, x1 - 44, y1 - 13 + 3 * sin(.9 * t), 0)
      leaf(x2, y2, x2 + 47, y2 - 14 + 3 * sin(.9 * t + PI), PI)
      pop()

      let flowerX = 260 + wind, flowerY = 265 + bob
      let tilt = .05 * sin(.8 * t), ct = cos(tilt), st = sin(tilt), shade = -1
      for (i = 7200; i--;) {
        j = i % 36, s = (i / 180 | 0) / 39, u = ((i / 36 | 0) % 5) / 2 - 1, y = j / 36, A = j * 2.4 + t / 10, L = (85 + 8 * (1 - y) ** 1) * (1 + .05 * sin(7.7 * j)), B = 1 - .3 * (.5 + .5 * sin(.45 * t + 3 * y - 1.2 * s)), e = (1.15 + .15 * y) * (1 - .95 * s) * B - .15 * s, r = L * s * cos(e), z = L * s * sin(e) + 4 * y + 3 * s * sin(7 * s - 1.6 * t + .9 * j), q = A + u * (16 + 2 * (1 - y)) * sin(PI * s ** .8) / (r + 14) + .05 * s * sin(.9 * t + 2.3 * j + 2.5 * s)
        if (s != shade) stroke(255 - 218 * s, 255 - 179 * s, 255, 160 - 20 * s), shade = s
        let px = r * cos(q), py = .52 * r * sin(q) - .86 * z
        point(flowerX + px * ct - py * st, flowerY + px * st + py * ct)
      }
    }
  </script>
</body>

</html>

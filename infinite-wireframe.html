<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinite — Morphing Wireframe</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .mark {
      position: fixed;
      top: 7px;
      left: 0;
      z-index: 2;
      color: rgba(238, 242, 255, .76);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -.8px;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(145, 170, 255, .32);
    }

    #error {
      display: none;
      position: fixed;
      inset: 0;
      place-items: center;
      color: #ddd;
      font: 14px/1.4 system-ui, sans-serif;
    }
  </style>
</head>

<body>
  <canvas id="scene" aria-label="A glowing triangular sphere unfolding into a colorful organic form"></canvas>
  <div id="error">This animation requires WebGL 2.</div>

  <script>
    (() => {
      const canvas = document.querySelector('#scene');
      const error = document.querySelector('#error');
      const gl = canvas.getContext('webgl2', {
        alpha: false,
        antialias: false,
        depth: true,
        powerPreference: 'high-performance'
      });

      if (!gl) {
        canvas.hidden = true;
        error.style.display = 'grid';
        return;
      }

      const vertexSource = `#version 300 es
        precision highp float;

        in vec3 position;
        in vec3 barycentric;
        uniform vec2 resolution;
        uniform float time;

        out vec3 bary;
        out vec3 glowColor;
        out float depthFade;

        #define PI 3.14159265359
        #define TAU 6.28318530718

        mat2 rot(float a) {
          float c = cos(a), s = sin(a);
          return mat2(c, -s, s, c);
        }

        float waves(vec3 p, float t) {
          float a = sin(p.x*3.1 + t*.73) * sin(p.y*3.7 - t*.59);
          float b = sin(p.y*5.3 + t*.41) * sin(p.z*4.1 + t*.67);
          float c = sin(p.z*6.2 - t*.53) * sin(p.x*4.7 - t*.37);
          return (a + b + c) / 3.0;
        }

        vec3 spectrum(float h) {
          vec3 k = vec3(0.0, 4.0, 2.0);
          return clamp(abs(mod(h*6.0 + k, 6.0) - 3.0) - 1.0, 0.0, 1.0);
        }

        void main() {
          float cycle = mod(time, 40.0) / 40.0;
          float rise = smoothstep(.035, .26, cycle);
          float fall = 1.0 - smoothstep(.66, .91, cycle);
          float amount = pow(rise * fall, .78);
          float storm = smoothstep(.14, .58, amount);
          float t = time * .47;

          vec3 n = normalize(position);
          float longitude = atan(n.y, n.x);
          float latitude = asin(n.z);
          float low = sin(longitude*4.0 + sin(latitude*3.0 - t*.31)*1.7 + t*.25);
          low *= .55 + .45*cos(latitude*3.0 + t*.18);
          float mid = waves(n*1.12, t);
          float fine = waves(n.zxy*2.05 + mid*.16, -t*.71);
          float ridge = sin(longitude*7.0 - latitude*5.0 + mid*4.2 + t*.42);

          float radius = 1.0 + amount*(.39*low + .28*mid + .18*ridge);
          radius += amount*storm*.23*fine;
          radius = max(radius, .24);
          vec3 p = n * radius;

          vec3 fold = vec3(
            waves(n.yzx*1.45 + vec3(1.3, 0.0, 0.0), t*.83),
            waves(n.zxy*1.52 + vec3(0.0, 2.1, 0.0), -t*.67),
            waves(n.xyz*1.61 + vec3(0.0, 0.0, 3.2), t*.74)
          );
          p += fold * (.48 * amount * storm);

          p.xz = rot(-.24 + time*.045) * p.xz;
          p.yz = rot(.16*sin(time*.093)) * p.yz;
          p.xy = rot(.08*sin(time*.071)) * p.xy;

          float hue = mix(.59, .145, cycle);
          hue += amount*(.28*mid + .18*ridge) + time*.003;
          float openingFlash = 1.0 - smoothstep(0.0, .025, cycle);
          hue = mix(hue, .085, openingFlash);
          vec3 color = spectrum(fract(hue));
          color = mix(color, vec3(1.0), .05 + .08*max(0.0, fine));

          float perspective = 1.0 / (3.45 - p.z*.22);
          vec2 screen = p.xy * perspective * 2.12;
          screen.x *= resolution.y / resolution.x;

          gl_Position = vec4(screen, p.z*.13, 1.0);
          bary = barycentric;
          glowColor = color;
          depthFade = .64 + .36*smoothstep(-1.2, 1.25, p.z);
        }
      `;

      const fragmentSource = `#version 300 es
        precision highp float;

        in vec3 bary;
        in vec3 glowColor;
        in float depthFade;
        out vec4 fragColor;

        void main() {
          vec3 d = fwidth(bary);
          vec3 core = smoothstep(d*.22, d*1.05, bary);
          vec3 halo = smoothstep(d*.15, d*3.6, bary);
          float line = 1.0 - min(min(core.x, core.y), core.z);
          float glow = 1.0 - min(min(halo.x, halo.y), halo.z);
          float alpha = (line*.73 + glow*.17) * depthFade;
          if (alpha < .015) discard;
          fragColor = vec4(glowColor * (line*1.12 + glow*.40), alpha);
        }
      `;

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(shader));
        }
        return shader;
      }

      function createIcosphere(subdivisions) {
        const phi = (1 + Math.sqrt(5)) / 2;
        const points = [
          [-1, phi, 0], [1, phi, 0], [-1, -phi, 0], [1, -phi, 0],
          [0, -1, phi], [0, 1, phi], [0, -1, -phi], [0, 1, -phi],
          [phi, 0, -1], [phi, 0, 1], [-phi, 0, -1], [-phi, 0, 1]
        ].map(normalize);
        let faces = [
          [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
          [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
          [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
          [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
        ].map(face => face.map(i => points[i]));

        for (let level = 0; level < subdivisions; level++) {
          const next = [];
          for (const [a, b, c] of faces) {
            const ab = normalize(add(a, b));
            const bc = normalize(add(b, c));
            const ca = normalize(add(c, a));
            next.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]);
          }
          faces = next;
        }

        const positions = new Float32Array(faces.length * 9);
        const barycentrics = new Float32Array(faces.length * 9);
        const corners = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
        let offset = 0;
        for (const face of faces) {
          for (let corner = 0; corner < 3; corner++) {
            positions.set(face[corner], offset);
            barycentrics.set(corners[corner], offset);
            offset += 3;
          }
        }
        return { positions, barycentrics, count: faces.length * 3 };
      }

      function add(a, b) {
        return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
      }

      function normalize(v) {
        const length = Math.hypot(v[0], v[1], v[2]);
        return [v[0] / length, v[1] / length, v[2] / length];
      }

      try {
        const program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program));
        }

        const mesh = createIcosphere(4);
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        function attribute(name, data) {
          const buffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
          gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
          const location = gl.getAttribLocation(program, name);
          gl.enableVertexAttribArray(location);
          gl.vertexAttribPointer(location, 3, gl.FLOAT, false, 0, 0);
        }

        attribute('position', mesh.positions);
        attribute('barycentric', mesh.barycentrics);

        gl.useProgram(program);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
        gl.disable(gl.CULL_FACE);
        gl.disable(gl.DEPTH_TEST);

        const resolutionLocation = gl.getUniformLocation(program, 'resolution');
        const timeLocation = gl.getUniformLocation(program, 'time');
        const start = performance.now();

        function frame(now) {
          const ratio = Math.min(devicePixelRatio || 1, 1.5);
          const width = Math.round(canvas.clientWidth * ratio);
          const height = Math.round(canvas.clientHeight * ratio);
          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
            gl.viewport(0, 0, width, height);
          }

          gl.clearColor(0, 0, 0, 1);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.uniform2f(resolutionLocation, width, height);
          gl.uniform1f(timeLocation, (now - start) / 1000);
          gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      } catch (message) {
        console.error(message);
        canvas.hidden = true;
        error.textContent = 'The wireframe shader could not be started on this device.';
        error.style.display = 'grid';
      }
    })();
  </script>
</body>

</html>

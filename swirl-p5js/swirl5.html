<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swirl — p5.js</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto !important;
      height: auto !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>

<body>
  <script>
    let a = 0;
    const dt = 0.1;
    const f = (x) => sin(PI * x) + sin(3.5 * x);
    const m = (x) => 175 + 85 * x;
    const pattern_strength = 0.25; // 0 restores Swirl2; 1 gives a stronger pattern.
    let pattern_t = 0;
    let pattern_x = 0;
    let pattern_y = 0;

    function setup() {
      createCanvas(350, 350);
      stroke(255);
    }

    function draw() {
      a++;
      background(0, 80);
      let index = 0;
      for (let t = 0, p = 0.002 * a + 1; t < 333; t += dt, p += dt) {
        const shape = Math.floor(index / 80);
        const ang_y = shape + pattern_y;
        const ang_x = TAU / 80 * shape + pattern_t + pattern_x;
        pattern_x = sin(ang_y) + sin(ang_x);
        pattern_y = cos(ang_y) + cos(ang_x);

        const colred = (4 * shape + frameCount) % 256;
        const colgreen = (4 * (index % 80)) % 256;
        stroke(colred, colgreen, 255 - colred);
        // Swirl1 modulates the radius and angle within Swirl2's original bounds.
        const radius = f(p) * (1 - pattern_strength * (pattern_y + 2) / 4);
        const angle = f(t) + pattern_strength * pattern_x / 2;
        // Draw separately so each point retains its own stroke color.
        point(m(radius * cos(angle)), m(radius * sin(angle)));
        index++;
      }
      pattern_t += 0.002;
    }
  </script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swirl — p5.js</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto !important;
      height: auto !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>

<body>
  <script>
    let a = 0;
    const dt = 0.1;
    const f = (x) => Math.sin(Math.PI * x) + Math.sin(3.5 * x);
    const m = (x) => 175 + 85 * x;
    const feather_width = 6; // Texture extends this many pixels around the original points.
    let pattern_t = 0;
    let pattern_x = 0;
    let pattern_y = 0;
    let pattern_frame = 0;
    let feathers, shape_mask, texture;

    function setup() {
      createCanvas(350, 350);
      feathers = createGraphics(350, 350);
      shape_mask = createGraphics(350, 350);
      texture = createGraphics(350, 350);
      for (const layer of [feathers, shape_mask, texture]) layer.pixelDensity(1);
      feathers.background(0);
      stroke(255);
    }

    function update_feathers() {
      pattern_frame++;
      feathers.background(0, 8);
      for (let shape = 0; shape < 80; shape++) {
        const shape_t = Math.PI * 2 / 80 * shape + pattern_t;
        const colred = (4 * shape + pattern_frame) % 256;
        for (let pnt = 0; pnt < 80; pnt++) {
          const ang_y = shape + pattern_y;
          const ang_x = shape_t + pattern_x;
          pattern_x = Math.sin(ang_y) + Math.sin(ang_x);
          pattern_y = Math.cos(ang_y) + Math.cos(ang_x);
          feathers.stroke(colred, (4 * pnt) % 256, 255 - colred);
          feathers.point(175 + 87.5 * pattern_x, 175 + 87.5 * pattern_y);
        }
      }
      pattern_t += 0.002;
    }

    function draw() {
      a++;
      background(0, 80);
      // Run the feather recurrence at one quarter of the default 60 FPS.
      if ((a - 1) % 4 === 0) update_feathers();

      shape_mask.clear();
      const mask_context = shape_mask.drawingContext;
      mask_context.beginPath();
      const points = [];
      for (let t = 0, p = 0.002 * a + 1; t < 333; t += dt, p += dt) {
        // These are Swirl2's original coordinates, without any deformation.
        const x = m(f(p) * Math.cos(f(t)));
        const y = m(f(p) * Math.sin(f(t)));
        points.push([x, y]);
        mask_context.moveTo(x + feather_width, y);
        mask_context.arc(x, y, feather_width, 0, Math.PI * 2);
      }
      mask_context.fillStyle = 'white';
      mask_context.fill();

      texture.clear();
      const texture_context = texture.drawingContext;
      texture_context.save();
      texture_context.drawImage(feathers.canvas, 0, 0);
      texture_context.globalCompositeOperation = 'destination-in';
      texture_context.drawImage(shape_mask.canvas, 0, 0);
      texture_context.restore();
      image(texture, 0, 0);

      // Keep the original colored point animation visible above the texture.
      for (let index = 0; index < points.length; index++) {
        const colred = (4 * Math.floor(index / 80) + frameCount) % 256;
        const colgreen = (4 * (index % 80)) % 256;
        stroke(colred, colgreen, 255 - colred);
        point(points[index][0], points[index][1]);
      }
    }
  </script>
</body>

</html>

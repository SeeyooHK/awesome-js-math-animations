<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swirl — p5.js</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto !important;
      height: auto !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>

<body>
  <script>
    const w = 500, hw = w / 2;
    const nshapes = 80;
    const npoints = 80;
    const R = 2 * Math.PI / nshapes;
    const sc = hw / 2;
    const f = (x) => Math.sin(Math.PI * x) + Math.sin(3.5 * x);
    const shape_strength = 0.6; // 0 shows the original Swirl1 feather pattern.
    let t = 0;
    let x = 0;
    let y = 0;

    function setup() {
      createCanvas(w, w);
      frameRate(15);
      background('black');
    }

    function draw() {
      translate(hw, hw);
      scale(sc);
      strokeWeight(1 / sc);
      background(0, 0, 0, 8);
      const phase = t + 1;
      const stretch_x = 1 - shape_strength * (0.15 + 0.075 * f(phase));
      const stretch_y = 1 - shape_strength * (0.15 + 0.075 * f(phase + 1));

      for (let shape = 0; shape < nshapes; shape++) {
        const shape_t = R * shape + t;
        const colred = (4 * shape + frameCount) % 256;
        for (let pnt = 0; pnt < npoints; pnt++) {
          // Keep Swirl1's complete recurrence intact to retain its feathers.
          const ang_y = shape + y;
          const ang_x = shape_t + x;
          x = Math.sin(ang_y) + Math.sin(ang_x);
          y = Math.cos(ang_y) + Math.cos(ang_x);

          // Smoothly twist the whole field; never feed warped points back in.
          const radius = Math.hypot(x, y);
          const twist = shape_strength * 0.35 * f(radius + phase);
          const c = Math.cos(twist);
          const s = Math.sin(twist);
          const plot_x = stretch_x * (x * c - y * s);
          const plot_y = stretch_y * (x * s + y * c);
          stroke(colred, (4 * pnt) % 256, 255 - colred);
          point(plot_x, plot_y);
        }
      }
      t += 0.002;
    }
  </script>
</body>

</html>

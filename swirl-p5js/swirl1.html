<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swirl — p5.js</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto !important;
      height: auto !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>

<body>
  <script>
    const w = 500, hw = w / 2;
    const ovlalpha = 8;
    const maxxy = 2.0;
    const nshapes = 80;
    const npoints = 80;
    const dt = 2E-3;
    const R = 2 * Math.PI / nshapes;
    const sc = hw / maxxy;
    const lw = 1 / sc;

    let t = 0;
    let x = 0;
    let y = 0;

    function setup() {
      createCanvas(w, w);
      frameRate(15);
      background('black');
    }

    function draw() {
      translate(hw, hw);
      scale(sc);
      strokeWeight(lw);
      background(0, 0, 0, ovlalpha);

      for (let shape = 0; shape < nshapes; shape++) {
        let shape_t = R * shape + t;
        let colred = (4 * shape + frameCount) % 256;
        for (let pnt = 0; pnt < npoints; pnt++) {
          let ang_y = shape + y;
          let ang_x = shape_t + x;
          x = Math.sin(ang_y) + Math.sin(ang_x);
          y = Math.cos(ang_y) + Math.cos(ang_x);
          let colgreen = (4 * pnt) % 256;
          stroke(colred, colgreen, 255 - colred);
          point(x, y);
        }
      }
      t = t + dt;
    }
  </script>
</body>

</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbiting Sphere Torus</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
  <script>
    t = 0
    draw = _ => {
      t || createCanvas(W = 600, W, WEBGL)
      background(0)
      p = PI / 40
      noStroke`miya`
      rotateX(.5)
      rotateY(-.5)
      r = 75
      R = 3.2
      q = .38
      for (y = 40; y--;)
        for (x = 80; x--; pop(sphere(.45 + cos(v) * .18)))
          push(), translate(
            (R + sin(v = (y + t) * p * 2) * q) * cos(u = (x + t) * p) * r,
            (R + sin(v) * q) * sin(u) * r,
            z = cos(v) * q * r
          )
      t = (t + .02) % 1
    }
  </script>
</body>
</html>

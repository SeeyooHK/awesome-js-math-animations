<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotating Point Field</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
  <script>
    t = 0
    draw = $ => {
      t || createCanvas(w = 400, w)
      clear(m = 200)
      for (t += PI / 240, i = 2e4; i--;)
        i > 6
          ? (d = 7 * cos(mag(k = i % 25 - 12, e = i / 800) / 3 + t / 2),
            point(k * 4 + d * k * sin(d + e / 9 + t) + m,
              e * 2 - d * 9 - d * 9 * cos(d + t) + m))
          : i ^ 6
            ? rotate(PI / 3).image(p, -m, -m)
            : (p = get()) + stroke(w, 46).background(9).translate(m, m)
    }
  </script>
</body>
</html>

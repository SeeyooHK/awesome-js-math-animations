<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated Flame</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #a0a2a1; }
  body { display: grid; place-items: center; }
  svg { display: block; width: min(100vw, 96.35vh); height: auto; overflow: visible; }
</style>
</head>
<body>
<svg viewBox="0 0 738 766" role="img" aria-label="A softly flickering, three-dimensional orange and yellow flame">
<defs>
  <linearGradient id="orange" x1="0" y1="0" x2=".85" y2=".8" gradientUnits="objectBoundingBox">
    <stop stop-color="#ff882c"/>
    <stop offset=".38" stop-color="#ff602b"/>
    <stop offset=".72" stop-color="#fa351e"/>
    <stop offset="1" stop-color="#e92016"/>
  </linearGradient>
  <radialGradient id="warm" cx=".23" cy=".26" r=".78">
    <stop stop-color="#ffac54" stop-opacity=".35"/>
    <stop offset=".52" stop-color="#ff8a46" stop-opacity=".1"/>
    <stop offset="1" stop-color="#a90000" stop-opacity=".24"/>
  </radialGradient>
  <radialGradient id="yellow" cx=".34" cy=".30" r=".76" gradientTransform="translate(0 -.08) scale(1 1.1)">
    <stop stop-color="#ffe780"/>
    <stop offset=".38" stop-color="#ffdf63"/>
    <stop offset=".70" stop-color="#ffbf33"/>
    <stop offset=".90" stop-color="#ff950c"/>
    <stop offset="1" stop-color="#ed7305"/>
  </radialGradient>
  <!-- A blurred silhouette acts as a height field for rounded, lit edges. -->
  <filter id="rubber" x="-20%" y="-15%" width="140%" height="135%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="30" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="12" diffuseConstant="1" lighting-color="#ffffff" result="light">
      <feDistantLight azimuth="225" elevation="53"/>
    </feDiffuseLighting>
    <feGaussianBlur in="light" stdDeviation="2" result="light"/>
    <feComposite in="light" in2="SourceGraphic" operator="arithmetic" k1=".5" k2="0" k3=".60" k4="0" result="shaded"/>
    <!-- Low-contrast grain and diffuse light give a soft molded-rubber finish. -->
    <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="8" result="grain"/>
    <feColorMatrix in="grain" type="saturate" values="0"/>
    <feComponentTransfer result="matte">
      <feFuncR type="linear" slope=".065" intercept=".94"/>
      <feFuncG type="linear" slope=".065" intercept=".94"/>
      <feFuncB type="linear" slope=".065" intercept=".94"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
    <feBlend in="shaded" in2="matte" mode="multiply"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-30%" y="-20%" width="160%" height="155%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
    <feOffset dx="1" dy="10"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .48  0 0 0 0 .065  0 0 0 0 0  0 0 0 .5 0"/>
  </filter>
  <path id="outer"/>
  <path id="inner"/>
</defs>
<g id="flames">
<g filter="url(#rubber)">
  <use href="#outer" fill="url(#orange)"/>
  <use href="#outer" fill="url(#warm)"/>
</g>
<use href="#inner" fill="#a72a00" filter="url(#shadow)"/>
<use href="#inner" fill="url(#yellow)" filter="url(#rubber)"/>
</g>
</svg>
<script>
(() => {
  // Cubic contours keep both the flame and its inset smooth throughout the loop.
  const outer = [
    ['M', 371, 695],
    ['C', 234, 697, 140, 625, 121, 526],
    ['C', 102, 438, 135, 383, 173, 317],
    ['C', 193, 282, 194, 258, 190, 239],
    ['C', 185, 218, 219, 225, 232, 251],
    ['C', 240, 264, 244, 276, 244, 288],
    ['C', 268, 244, 303, 218, 320, 178],
    ['C', 340, 132, 326, 96, 324, 76],
    ['C', 320, 49, 341, 53, 361, 66],
    ['C', 432, 107, 477, 174, 495, 245],
    ['C', 510, 294, 515, 337, 527, 368],
    ['C', 537, 337, 556, 313, 580, 305],
    ['C', 606, 292, 607, 307, 604, 329],
    ['C', 601, 352, 613, 380, 622, 414],
    ['C', 653, 529, 613, 609, 546, 654],
    ['C', 498, 687, 435, 698, 371, 695], ['Z']
  ];
  const inner = [
    ['M', 375, 667],
    ['C', 294, 668, 237, 613, 235, 543],
    ['C', 231, 478, 266, 442, 305, 405],
    ['C', 340, 372, 366, 348, 363, 313],
    ['C', 359, 288, 378, 299, 395, 315],
    ['C', 429, 345, 437, 379, 444, 414],
    ['C', 448, 438, 455, 463, 466, 449],
    ['C', 475, 437, 475, 420, 484, 432],
    ['C', 507, 465, 520, 502, 518, 542],
    ['C', 516, 615, 457, 666, 375, 667], ['Z']
  ];
  const outerNode = document.getElementById('outer');
  const innerNode = document.getElementById('inner');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const svg = document.querySelector('svg');
  const flames = document.getElementById('flames');
  const pointer = { x: 0, y: 0, vx: 0, vy: 0, targetX: 0, targetY: 0 };
  function aim(x, y) {
    pointer.targetX = x;
    pointer.targetY = y;
    if (reduced.matches) {
      pointer.x = x;
      pointer.y = y;
      pointer.vx = pointer.vy = 0;
      render(0);
    }
  }
  function followPointer(event) {
    const bounds = svg.getBoundingClientRect();
    aim(
      Math.max(-1, Math.min(1, (event.clientX - bounds.left - bounds.width / 2) / (bounds.width / 2))),
      Math.max(-1, Math.min(1, (event.clientY - bounds.top - bounds.height / 2) / (bounds.height / 2)))
    );
  }
  window.addEventListener('pointermove', followPointer, { passive: true });
  window.addEventListener('pointerdown', followPointer, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => aim(0, 0));
  window.addEventListener('blur', () => aim(0, 0));
  window.addEventListener('pointercancel', () => aim(0, 0));
  window.addEventListener('pointerup', event => {
    if (event.pointerType !== 'mouse') aim(0, 0);
  });
  const period = 2.4;
  // Tip positions and center width sampled at 100 ms intervals from the recording.
  // Columns: orange x/y, yellow x/y, yellow body center/width.
  const poses = [[349,58,368,302,365,252],[349,58,371,298,365,254],[349,58,372,298,365,254],[350,58,374,292,364,254],[350,58,376,288,364,256],[350,58,378,284,363,260],[352,58,381,276,363,262],[353,56,382,272,362,266],[360,56,386,266,361,268],[365,56,390,262,360,268],[370,54,393,256,358,268],[379,50,399,254,355,264],[387,50,400,254,354,256],[399,48,389,252,353,238],[404,48,369,242,356,226],[403,50,343,228,356,214],[387,52,319,242,354,204],[370,50,350,252,353,204],[349,50,395,256,360,226],[345,52,413,272,369,242],[345,56,411,284,372,244],[349,58,384,292,372,244],[349,58,368,298,371,246],[349,58,360,304,370,246],[350,58,358,308,369,248]];
  function motion(time) {
    const position = ((time % period + period) % period) / .1;
    const index = Math.floor(position), t = position - index;
    const count = poses.length - 1;
    const sample = i => poses[(i % count + count) % count];
    // Remove small tracking jitters before interpolating the expressive poses.
    const at = i => sample(i).map((v, c) =>
      .2 * sample(i - 1)[c] + .6 * v + .2 * sample(i + 1)[c]);
    return at(index).map((value, channel) => {
      const a = at(index - 1)[channel], b = value;
      const c = at(index + 1)[channel], d = at(index + 2)[channel];
      // Cubic interpolation preserves the quick reversals without pausing at samples.
      return .5 * ((2 * b) + (-a + c) * t
        + (2 * a - 5 * b + 4 * c - d) * t * t
        + (-a + 3 * b - 3 * c + d) * t * t * t);
    });
  }
  function contour(points, time, inset) {
    // The chest leads a turn; the soft tip and side lobes follow a little later.
    const pose = motion(time + .06);
    const trailing = motion(time - (inset ? .075 : .11));
    const tipX = inset ? trailing[2] - 359 : trailing[0] - 349;
    const tipY = inset ? trailing[3] - 308 : trailing[1] - 58;
    const followThrough = pose[inset ? 2 : 0] - trailing[inset ? 2 : 0];
    const fold = inset ? Math.max(0, Math.min(1, (246 - pose[5]) / 42)) : 0;
    const squash = inset ? .035 * fold : .018 * (pose[0] - 349) / 55;
    const roll = followThrough * (inset ? .0005 : .00035);
    return points.map(([command, ...coords]) => {
      const warped = [];
      for (let i = 0; i < coords.length; i += 2) {
        const x = coords[i], y = coords[i + 1];
        const height = Math.max(0, Math.min(1, ((inset ? 667 : 695) - y) / (inset ? 369 : 640)));
        const belly = Math.sin(Math.PI * height);
        const squeeze = inset ? (x - 375) * (pose[5] / 246 - 1) * belly : 0;
        const drift = ((inset ? pose[4] - 366 : (pose[4] - 366) * .4)
          + followThrough * .25) * belly;
        // Fold the small yellow tongue into the shoulder as the flame turns.
        const shoulder = inset ? Math.exp(-Math.pow((x - 476) / 53, 2)
          - Math.pow((y - 431) / 68, 2)) * fold : 0;
        const base = inset ? 667 : 695;
        const reach = Math.pow(height, 1.5);
        const px = x + squeeze + drift + tipX * Math.pow(height, 2.4) - 17 * shoulder
          + pointer.x * (inset ? 44 : 32) * reach;
        const py = y + tipY * Math.pow(height, 1.7) + 64 * shoulder
          + pointer.y * (inset ? 24 : 18) * reach;
        // A small, volume-preserving squash and roll engages the whole body.
        const dx = (px - 375) * (1 + squash);
        const dy = (py - base) / (1 + squash);
        warped.push((375 + dx * Math.cos(roll) - dy * Math.sin(roll)).toFixed(2));
        warped.push((base + dx * Math.sin(roll) + dy * Math.cos(roll)).toFixed(2));
      }
      return command + warped.join(' ');
    }).join(' ');
  }
  function render(time) {
    flames.setAttribute('transform', `translate(${pointer.x * 48} ${pointer.y * 30}) rotate(${pointer.x * 3} 375 600)`);
    outerNode.setAttribute('d', contour(outer, time, false));
    innerNode.setAttribute('d', contour(inner, time, true));
  }
  let frame;
  const start = performance.now();
  let previous = start;
  function tick(now) {
    const dt = Math.min((now - previous) / 1000, 1 / 30);
    previous = now;
    // A damped spring makes following and returning soft, without snapping.
    for (const axis of ['x', 'y']) {
      const target = axis === 'x' ? pointer.targetX : pointer.targetY;
      const velocity = axis === 'x' ? 'vx' : 'vy';
      pointer[velocity] += ((target - pointer[axis]) * 85 - pointer[velocity] * 16) * dt;
      pointer[axis] += pointer[velocity] * dt;
    }
    render(reduced.matches ? 0 : (now - start) / 1000);
    if (!reduced.matches) frame = requestAnimationFrame(tick);
  }
  reduced.addEventListener('change', () => { cancelAnimationFrame(frame); tick(performance.now()); });
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(frame);
    if (!document.hidden) tick(performance.now());
  });
  tick(start);
})();
</script>
</body>
</html>

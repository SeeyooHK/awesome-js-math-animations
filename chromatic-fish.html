<!-- Equations and colour treatment referenced from @Mathbelirium https://x.com/mathelirium variation from @yuruyurau
 https://x.com/yuruyurau. -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chromatic Fish</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      width: min(96vw, 96vh) !important;
      height: min(96vw, 96vh) !important;
    }
  </style>
</head>

<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script>
    const CANVAS_SIZE = 400;
    const POINT_COUNT = 30000;
    let t = 0;

    function setup() {
      const canvas = createCanvas(CANVAS_SIZE, CANVAS_SIZE);
      canvas.attribute(
        "aria-label",
        "An animated rainbow fish formed by flowing mathematical particles"
      );

      pixelDensity(min(window.devicePixelRatio || 1, 2));
      colorMode(HSB, 360, 100, 100, 100);
      strokeWeight(1.15);
      frameRate(30);
    }

    function drawFishPoint(x, y, hue) {
      const k = x / 4 - 12.5;
      const e = y / 9;
      const o = sqrt(k * k + e * e) / 9;
      const q =
        x +
        99 +
        cos(9 / (k + 0.000001)) +
        o *
        k *
        (cos(9 * e) / 3 + cos(y / 9) / 0.7) *
        sin(4 * o - t);
      const c = (o * e) / 30 - t / 8;
      const px = q * 0.7 * sin(c) + 200;
      const py =
        200 + (y / 9) * cos(4 * c - t / 2) - (q / 2) * cos(c);

      stroke(hue, 88, 100, 36);
      point(px, py);
    }

    function draw() {
      background(0);
      blendMode(ADD);

      for (let i = 1; i <= POINT_COUNT; i += 1) {
        const x = i % 100;
        const y = i / 150;
        const hue = (i / POINT_COUNT) * 360;
        drawFishPoint(x, y, hue);
      }

      blendMode(BLEND);
      t += PI / 180;
    }
  </script>
</body>

</html>

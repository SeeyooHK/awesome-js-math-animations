<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chromatic Landscape Flight</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efaa7c}
    canvas{display:block;width:100%!important;height:100%!important;image-rendering:auto}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
</head>
<body>
<script>
const W=820,H=456,NEAR=.55,FAR=42;
const P={
  sky:['#ffbd85','#f7a075','#ffca94','#ee858a','#d782a2','#bd7fb8','#f05d79','#844d69'],
  field:['#469553','#69a94d','#2f7547','#a09e3c','#d35b39','#ef743e','#bd3c3e','#795238'],
  flowers:['#fff2dc','#f6c0d5','#ef769c','#f05c59','#ffd779','#f5a34d','#b875c5','#e8eee1'],
  dark:['#173f2c','#225537','#386537','#562d38','#77363b','#9b3b38','#bd4438','#d05a3f'],
  horizon:['#8b6ca2','#5e6d9d','#cf658b','#45a688','#ee756b','#493e65'],
  light:['#fff2dc','#ffd6c0','#f7bfd3','#fff1a8']
};
let pts=[],moving=true,t=0,cnv;
let seed=0x51f15e;
function rnd(){seed=(Math.imul(seed^seed>>>15,1|seed)+0x6d2b79f5)|0;return((seed^seed>>>14)>>>0)/4294967296}
function choose(a){return a[(rnd()*a.length)|0]}
function add(kind,n){
  for(let i=0;i<n;i++){
    let x,y,z=NEAR+rnd()*(FAR-NEAR),pal=P.sky;
    if(kind==='field'||kind==='flowers'){
      x=(rnd()*2-1)*20;
      y=1.32 + .24*Math.sin(x*.62+z*.25)+rnd()*.22;
      pal=kind==='flowers'?P.flowers:P.field;
    }else if(kind==='ceiling'){
      x=(rnd()*2-1)*22;
      y=-3.25-rnd()*4.3;
      pal=P.sky;
    }else if(kind==='left'||kind==='right'){
      const s=kind==='left'?-1:1;
      x=s*(4.4+Math.pow(rnd(),.65)*12);
      y=-2.7+rnd()*5.15;
      pal=P.dark;
    }else{
      x=(rnd()*2-1)*17;
      y=-.12-Math.pow(rnd(),.72)*2.7;
      z=11+rnd()*22;
      pal=P.horizon;
    }
    const bright=rnd()<.026;
    pts.push({x,y,z,c:choose(bright?P.light:pal),s:bright?1.8+rnd()*2.4:.45+rnd()*1.45,k:kind,w:rnd(),phase:rnd()*6.283});
  }
}
function setup(){
  pixelDensity(1);cnv=createCanvas(W,H);cnv.elt.style.width='100%';cnv.elt.style.height='100%';
  add('field',30000);add('flowers',11500);add('ceiling',24000);add('left',9000);add('right',9000);add('horizon',11500);
  strokeCap(SQUARE);noSmooth();
}
function proj(p,z,cx,cy,f){
  const bend=Math.sin(p.phase+z*.17+t*.025)*.16;
  return{x:cx+(p.x+bend)*f/z,y:cy+p.y*f/z};
}
function draw(){
  const g=drawingContext;
  const bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#e98b8b');bg.addColorStop(.50,'#ffc08a');bg.addColorStop(.505,'#75655e');bg.addColorStop(1,'#647544');
  g.fillStyle=bg;g.globalAlpha=1;g.fillRect(0,0,W,H);

  const dt=Math.min(deltaTime,34)/16.667,step=.12*dt;
  if(moving)t+=step;
  const mx=(mouseX/Math.max(width,1)-.5),my=(mouseY/Math.max(height,1)-.5);
  const cx=W*(.5+mx*.026),cy=H*(.505+my*.018),f=H*.62;
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    if(moving){p.z-=step;if(p.z<NEAR)p.z+=FAR-NEAR}
    const a=proj(p,p.z,cx,cy,f);
    if(a.x<-20||a.x>W+20||a.y<-20||a.y>H+20)continue;
    const trail=.15+1.9/(p.z+.35);
    const b=proj(p,Math.min(FAR,p.z+trail),cx,cy,f);
    const depth=1-p.z/FAR;
    let alpha=.58+depth*.42;
    if(p.k==='ceiling'){
      const opening=Math.hypot((a.x-cx)/(W*.28),(a.y-cy)/(H*.2));
      if(opening<.48&&p.z>8)alpha*=opening/.48;
    }
    g.globalAlpha=alpha;g.strokeStyle=p.c;
    g.lineWidth=Math.max(.85,p.s*(.55+depth*2.8));
    g.beginPath();g.moveTo(b.x,b.y);g.lineTo(a.x,a.y);g.stroke();
    if(p.s>1.7&&depth>.2){g.fillStyle=p.c;g.fillRect(a.x-g.lineWidth*.4,a.y-g.lineWidth*.35,g.lineWidth*1.65,g.lineWidth*.7)}
  }
  g.globalAlpha=.16;g.fillStyle='#ffe1aa';g.beginPath();g.ellipse(cx,cy-8,W*.15,H*.105,0,0,Math.PI*2);g.fill();
  g.globalAlpha=1;
}
function mousePressed(){moving=!moving}
function touchStarted(){moving=!moving;return false}
function windowResized(){}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chromatic Landscape Flight — Three.js</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efaa7c}
    canvas{display:block;width:100%;height:100%;touch-action:none}
  </style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js';

const NEAR=.55,FAR=42,RANGE=FAR-NEAR;
const P={
  sky:['#ffbd85','#f7a075','#ffca94','#ee858a','#d782a2','#bd7fb8','#f05d79','#844d69'],
  field:['#469553','#69a94d','#2f7547','#a09e3c','#d35b39','#ef743e','#bd3c3e','#795238'],
  flowers:['#fff2dc','#f6c0d5','#ef769c','#f05c59','#ffd779','#f5a34d','#b875c5','#e8eee1'],
  dark:['#173f2c','#225537','#386537','#562d38','#77363b','#9b3b38','#bd4438','#d05a3f'],
  horizon:['#8b6ca2','#5e6d9d','#cf658b','#45a688','#ee756b','#493e65'],
  light:['#fff2dc','#ffd6c0','#f7bfd3','#fff1a8']
};
const regions=[['field',30000],['flowers',11500],['ceiling',24000],['left',9000],['right',9000],['horizon',11500]];
const count=regions.reduce((sum,region)=>sum+region[1],0);
const base=new Float32Array(count*3),colors=new Float32Array(count*3);
const sizes=new Float32Array(count),phases=new Float32Array(count);
const kinds=new Float32Array(count),brights=new Float32Array(count);
let seed=0x51f15e,index=0;
function rnd(){seed=(Math.imul(seed^seed>>>15,1|seed)+0x6d2b79f5)|0;return((seed^seed>>>14)>>>0)/4294967296}
function choose(list){return list[(rnd()*list.length)|0]}
function rgb(hex){const n=parseInt(hex.slice(1),16);return[(n>>16)/255,((n>>8)&255)/255,(n&255)/255]}
function add(kind,n,kindIndex){
  for(let i=0;i<n;i++,index++){
    let x,y,z=NEAR+rnd()*RANGE,palette=P.sky;
    if(kind==='field'||kind==='flowers'){
      x=(rnd()*2-1)*20;y=1.32+.24*Math.sin(x*.62+z*.25)+rnd()*.22;
      palette=kind==='flowers'?P.flowers:P.field;
    }else if(kind==='ceiling'){
      x=(rnd()*2-1)*22;y=-3.25-rnd()*4.3;
    }else if(kind==='left'||kind==='right'){
      x=(kind==='left'?-1:1)*(4.4+Math.pow(rnd(),.65)*12);
      y=-2.7+rnd()*5.15;palette=P.dark;
    }else{
      x=(rnd()*2-1)*17;y=-.12-Math.pow(rnd(),.72)*2.7;
      z=11+rnd()*22;palette=P.horizon;
    }
    const bright=rnd()<.026,c=rgb(choose(bright?P.light:palette)),o=index*3;
    base[o]=x;base[o+1]=y;base[o+2]=z;
    colors[o]=c[0];colors[o+1]=c[1];colors[o+2]=c[2];
    sizes[index]=bright?1.8+rnd()*2.4:.45+rnd()*1.45;
    kinds[index]=kindIndex;brights[index]=bright?1:0;
    rnd();phases[index]=rnd()*Math.PI*2;
  }
}
regions.forEach((region,i)=>add(region[0],region[1],i));

const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.autoClear=false;
document.body.append(renderer.domElement);

const screenVertex=`varying vec2 vUv;void main(){vUv=position.xy*.5+.5;gl_Position=vec4(position.xy,0.,1.);}`;
const screenGeometry=new THREE.BufferGeometry();
screenGeometry.setAttribute('position',new THREE.Float32BufferAttribute([-1,-1,0,3,-1,0,-1,3,0],3));
const screenCamera=new THREE.Camera(),backgroundScene=new THREE.Scene();
backgroundScene.add(new THREE.Mesh(screenGeometry,new THREE.ShaderMaterial({
  depthTest:false,depthWrite:false,vertexShader:screenVertex,
  fragmentShader:`varying vec2 vUv;void main(){
    float y=1.-vUv.y;vec3 c;
    if(y<.5)c=mix(vec3(.914,.545,.545),vec3(1.,.753,.541),y/.5);
    else if(y<.505)c=mix(vec3(1.,.753,.541),vec3(.459,.396,.369),(y-.5)/.005);
    else c=mix(vec3(.459,.396,.369),vec3(.392,.459,.267),(y-.505)/.495);
    gl_FragColor=vec4(c,1.);
  }`
})));

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(77.78,innerWidth/innerHeight,.1,50);
const shared={
  uTravel:{value:0},uResolution:{value:new THREE.Vector2()},
  uCenter:{value:new THREE.Vector2()},uPixelRatio:{value:1}
};
const particleVertexHeader=`
  attribute vec3 aBase;attribute vec3 aColor;attribute float aSize;
  attribute float aPhase;attribute float aKind;attribute float aBright;
  uniform float uTravel;uniform vec2 uResolution;uniform vec2 uCenter;uniform float uPixelRatio;
  varying vec3 vColor;varying float vAlpha;varying float vSeed;
  vec2 projectPoint(vec2 p,float z){
    vec4 clip=projectionMatrix*vec4(p.x,-p.y,-z,1.);
    return clip.xy/clip.w+uCenter;
  }
  float particleZ(){return .55+mod(aBase.z-.55-uTravel+41.45,41.45);}
  float openingAlpha(vec2 ndc,float z){
    if(aKind<1.5||aKind>2.5||z<=8.)return 1.;
    float opening=length((ndc-uCenter)*.5/vec2(.28,.2));
    return opening<.48?opening/.48:1.;
  }
`;
const strokeAttributes={
  aBase:new THREE.InstancedBufferAttribute(base,3),aColor:new THREE.InstancedBufferAttribute(colors,3),
  aSize:new THREE.InstancedBufferAttribute(sizes,1),aPhase:new THREE.InstancedBufferAttribute(phases,1),
  aKind:new THREE.InstancedBufferAttribute(kinds,1),aBright:new THREE.InstancedBufferAttribute(brights,1)
};
const strokeGeometry=new THREE.InstancedBufferGeometry();
strokeGeometry.setAttribute('position',new THREE.Float32BufferAttribute([0,-1,0,1,-1,0,1,1,0,0,-1,0,1,1,0,0,1,0],3));
Object.entries(strokeAttributes).forEach(([name,attribute])=>strokeGeometry.setAttribute(name,attribute));
strokeGeometry.instanceCount=count;
const strokeMaterial=new THREE.ShaderMaterial({
  transparent:true,depthTest:false,depthWrite:false,blending:THREE.NormalBlending,uniforms:shared,
  vertexShader:particleVertexHeader+`
    varying vec2 vBrush;
    void main(){
      float z=particleZ(),depth=1.-z/42.;
      float bend=sin(aPhase+z*.17+uTravel*.025)*.16;
      float trail=.15+1.9/(z+.35),zBack=min(42.,z+trail);
      float bendBack=sin(aPhase+zBack*.17+uTravel*.025)*.16;
      vec2 front=projectPoint(vec2(aBase.x+bend,aBase.y),z);
      vec2 back=projectPoint(vec2(aBase.x+bendBack,aBase.y),zBack);
      vec2 frontPx=front*uResolution*.5,backPx=back*uResolution*.5;
      vec2 direction=frontPx-backPx;
      vec2 normal=length(direction)>.001?normalize(vec2(-direction.y,direction.x)):vec2(0.,1.);
      float width=max(.85,aSize*(.55+depth*2.8))*uPixelRatio;
      vec2 px=mix(backPx,frontPx,position.x)+normal*position.y*width*.5;
      gl_Position=vec4(px*2./uResolution,mix(.8,-.8,depth),1.);
      vColor=aColor;vAlpha=(.58+depth*.42)*openingAlpha(front,z);
      vSeed=aPhase;vBrush=position.xy;
    }
  `,
  fragmentShader:`varying vec3 vColor;varying float vAlpha;varying float vSeed;varying vec2 vBrush;
    void main(){
      float edge=.92+.07*sin(vBrush.x*31.+vSeed*5.);
      float mask=1.-smoothstep(edge,1.,abs(vBrush.y));
      float pigment=.94+.06*sin(vBrush.x*47.+vSeed*11.);
      gl_FragColor=vec4(vColor*pigment,vAlpha*mask);
    }`
});
const strokes=new THREE.Mesh(strokeGeometry,strokeMaterial);strokes.frustumCulled=false;scene.add(strokes);

const pointGeometry=new THREE.BufferGeometry();
pointGeometry.setAttribute('position',new THREE.BufferAttribute(base,3));
pointGeometry.setAttribute('aBase',new THREE.BufferAttribute(base,3));
pointGeometry.setAttribute('aColor',new THREE.BufferAttribute(colors,3));
pointGeometry.setAttribute('aSize',new THREE.BufferAttribute(sizes,1));
pointGeometry.setAttribute('aPhase',new THREE.BufferAttribute(phases,1));
pointGeometry.setAttribute('aKind',new THREE.BufferAttribute(kinds,1));
pointGeometry.setAttribute('aBright',new THREE.BufferAttribute(brights,1));
const pointMaterial=new THREE.ShaderMaterial({
  transparent:true,depthTest:false,depthWrite:false,blending:THREE.NormalBlending,uniforms:shared,
  vertexShader:particleVertexHeader+`
    varying float vVisible;
    void main(){
      float z=particleZ(),depth=1.-z/42.;
      float bend=sin(aPhase+z*.17+uTravel*.025)*.16;
      vec2 ndc=projectPoint(vec2(aBase.x+bend,aBase.y),z);
      gl_Position=vec4(ndc,mix(.8,-.8,depth),1.);
      float width=max(.85,aSize*(.55+depth*2.8));
      gl_PointSize=width*1.65*uPixelRatio;
      vColor=aColor;vAlpha=openingAlpha(ndc,z);vSeed=aPhase;
      vVisible=step(1.7,aSize)*step(.2,depth)*aBright;
    }
  `,
  fragmentShader:`varying vec3 vColor;varying float vAlpha;varying float vSeed;varying float vVisible;
    void main(){
      if(vVisible<.5||abs(gl_PointCoord.y-.5)>.215)discard;
      gl_FragColor=vec4(vColor,.82*vAlpha);
    }`
});
const highlights=new THREE.Points(pointGeometry,pointMaterial);highlights.frustumCulled=false;scene.add(highlights);

const haloScene=new THREE.Scene();
haloScene.add(new THREE.Mesh(screenGeometry,new THREE.ShaderMaterial({
  transparent:true,depthTest:false,depthWrite:false,
  uniforms:{uCenter:shared.uCenter,uResolution:shared.uResolution,uPixelRatio:shared.uPixelRatio},
  vertexShader:screenVertex,
  fragmentShader:`uniform vec2 uCenter;uniform vec2 uResolution;uniform float uPixelRatio;varying vec2 vUv;void main(){
    vec2 center=vec2(.5)+uCenter*.5+vec2(0.,8.*uPixelRatio/uResolution.y);
    float d=length((vUv-center)/vec2(.075,.0525));
    float alpha=.16*(1.-smoothstep(.94,1.,d));
    gl_FragColor=vec4(vec3(1.,.882,.667),alpha);
  }`
})));

let moving=true,travel=0,last=performance.now();
const pointer=new THREE.Vector2();
addEventListener('pointermove',event=>{
  pointer.set(event.clientX/innerWidth-.5,event.clientY/innerHeight-.5);
},{passive:true});
addEventListener('pointerdown',()=>{moving=!moving});
function resize(){
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
  renderer.getDrawingBufferSize(shared.uResolution.value);shared.uPixelRatio.value=renderer.getPixelRatio();
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(now-last,34)/16.667;last=now;
  if(moving)travel=(travel+.12*dt)%RANGE;
  shared.uCenter.value.set(pointer.x*.052,-pointer.y*.036);shared.uTravel.value=travel;
  renderer.clear();renderer.render(backgroundScene,screenCamera);
  renderer.clearDepth();renderer.render(scene,camera);
  renderer.clearDepth();renderer.render(haloScene,screenCamera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>

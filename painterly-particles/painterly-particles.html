<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painterly Particle Flight</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f2aa78; }
    canvas { display: block; }
    .hint { position: fixed; right: 14px; bottom: 12px; color: #3a273780; font: 10px/1.4 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; pointer-events: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
</head>
<body>
  <div class="hint">move · click to pause</div>
  <script>
    const FAR = 30, NEAR = .55, COUNT = 21000;
    const particles = [];
    let running = true, travel = 0;

    const palettes = {
      ground: ['#ee673f', '#cb3e38', '#f28b3f', '#318b50', '#54a64d', '#b5a942', '#f5b85c', '#823d45'],
      left:   ['#2c6b42', '#174a38', '#6c7938', '#cb4d47', '#de7845', '#823d53', '#263e35'],
      right:  ['#183e31', '#255f3c', '#354829', '#ad3d48', '#dd6648', '#792c45', '#202e2c'],
      sky:    ['#ffc083', '#f5a077', '#ef7f78', '#e996ad', '#c57db3', '#ffd09b', '#e94f71', '#8d668f'],
      light:  ['#ffe4be', '#fff0da', '#f8cad6', '#f9e2a3']
    };

    function pick(list) { return list[(Math.random() * list.length) | 0]; }
    function makeParticle(i) {
      const r = Math.random();
      let region, x, y;
      if (r < .43) {
        region = 'ground';
        x = (Math.random() * 2 - 1) * 15;
        y = 2.0 + Math.pow(Math.random(), .62) * 7.5;
      } else if (r < .62) {
        region = 'left';
        x = -5.3 - Math.pow(Math.random(), .72) * 9;
        y = -3.3 + Math.random() * 8.2;
      } else if (r < .81) {
        region = 'right';
        x = 5.3 + Math.pow(Math.random(), .72) * 9;
        y = -3.8 + Math.random() * 8.5;
      } else {
        region = 'sky';
        x = (Math.random() * 2 - 1) * 15;
        y = -2.0 - Math.pow(Math.random(), .75) * 7.0;
      }
      const bright = Math.random() < .038;
      return {
        x, y, z: NEAR + Math.random() * (FAR - NEAR),
        color: pick(bright ? palettes.light : palettes[region]),
        size: bright ? 1.4 + Math.random() * 2 : .35 + Math.random() * 1.25,
        phase: Math.random() * Math.PI * 2,
        region, seed: Math.random() * 999
      };
    }

    function setup() {
      pixelDensity(Math.min(devicePixelRatio, 1.5));
      createCanvas(windowWidth, windowHeight);
      noStroke();
      for (let i = 0; i < COUNT; i++) particles.push(makeParticle(i));
    }

    function projection(p, z, focal, cx, cy, bend) {
      const wave = Math.sin(p.seed + z * .22 + travel * .08) * bend;
      return { x: cx + (p.x + wave) * focal / z, y: cy + p.y * focal / z };
    }

    function draw() {
      const ctx = drawingContext;
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#ed8d92');
      grad.addColorStop(.44, '#f9b27f');
      grad.addColorStop(.57, '#a37173');
      grad.addColorStop(1, '#7a5639');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      const dt = Math.min(deltaTime, 35) / 16.667;
      const speed = 0.185 * dt;
      if (running) travel += speed;
      const cx = width * (.5 + (mouseX / Math.max(width, 1) - .5) * .055);
      const cy = height * (.49 + (mouseY / Math.max(height, 1) - .5) * .035);
      const focal = Math.min(width, height) * .57;

      ctx.globalCompositeOperation = 'source-over';
      for (const p of particles) {
        if (running) {
          p.z -= speed;
          if (p.z < NEAR) p.z += FAR - NEAR;
        }
        const a = projection(p, p.z, focal, cx, cy, .36);
        const b = projection(p, Math.min(FAR, p.z + .24 + 1.15 / p.z), focal, cx, cy, .36);
        if (a.x < -35 || a.x > width + 35 || a.y < -30 || a.y > height + 30) continue;
        const depth = 1 - p.z / FAR;
        ctx.globalAlpha = .28 + depth * .72;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(.65, p.size * (.48 + depth * 3.8));
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(a.x, a.y);
        ctx.stroke();
        if (p.size > 1.35 && depth > .35) {
          ctx.fillStyle = p.color;
          ctx.fillRect(a.x, a.y, ctx.lineWidth * 1.35, ctx.lineWidth * .8);
        }
      }

      ctx.globalAlpha = .14;
      ctx.fillStyle = '#ffe2aa';
      ctx.beginPath();
      ctx.ellipse(cx, cy - height * .035, width * .18, height * .13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    function mousePressed() { running = !running; }
    function touchStarted() { running = !running; return false; }
    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</body>
</html>

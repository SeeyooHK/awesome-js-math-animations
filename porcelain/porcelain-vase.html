<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celadon Porcelain Vase</title>
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020405}
  body{font:12px/1.4 Inter,ui-sans-serif,system-ui,sans-serif;color:#fff}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .info{position:fixed;right:20px;bottom:20px;padding:8px 16px;border:1px solid rgba(196,255,246,.24);border-radius:30px;background:rgba(0,8,9,.55);backdrop-filter:blur(8px);text-align:center;pointer-events:none}
  .info b{font-weight:600}.info span{opacity:.72}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="info"><b>Celadon Porcelain Vase</b><br><span>drag to inspect · scroll to zoom</span></div>
<script type="module">
import * as THREE from 'three/webgpu';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020405);
scene.fog = new THREE.Fog(0x020405, 15, 28);

const camera = new THREE.PerspectiveCamera(27, innerWidth / innerHeight, 0.1, 40);
camera.position.set(4.2, 4.25, 15.2);

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
await renderer.init();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.05, 0);
controls.enableDamping = true;
controls.minDistance = 8;
controls.maxDistance = 20;
controls.minPolarAngle = Math.PI * .25;
controls.maxPolarAngle = Math.PI * .56;

// Closed cross-section: the returning inner profile gives the mouth real depth.
const profile = [
  [0.38,0.00],[0.48,0.05],[0.50,0.14],[0.46,0.22],
  [0.68,0.27],[0.86,0.42],[1.05,0.72],[1.22,1.12],
  [1.31,1.56],[1.29,1.90],[1.18,2.35],[1.02,2.85],
  [0.84,3.42],[0.67,4.03],[0.57,4.58],[0.53,5.10],
  [0.55,5.55],[0.66,5.94],[0.80,6.12],[0.78,6.20],
  [0.65,6.24],[0.51,6.08],[0.44,5.75],[0.43,5.36],
  [0.46,4.92],[0.50,4.62],[0.57,4.51],[0.59,4.44],[0.00,4.44]
].map(([x,y]) => new THREE.Vector2(x,y));

const vaseGeometry = new THREE.LatheGeometry(profile, 96);
const positions = vaseGeometry.attributes.position;
const normal = new THREE.Vector3();
for (let i = 0; i < positions.count; i++) {
  normal.fromBufferAttribute(positions, i);
  const radius = Math.hypot(normal.x, normal.z);
  const angle = Math.atan2(normal.z, normal.x);
  const bodyMask = THREE.MathUtils.smoothstep(normal.y, .30, 1.0)
                 * (1 - THREE.MathUtils.smoothstep(normal.y, 4.35, 5.05));
  // The original has restrained, hand-cut vertical facets rather than a perfect body.
  const facet = 1 + bodyMask * (0.018 * Math.cos(angle * 10 + normal.y * .45)
               + 0.006 * Math.cos(angle * 20 - normal.y * .7));
  positions.setX(i, normal.x * facet);
  positions.setZ(i, normal.z * facet);
}
positions.needsUpdate = true;
vaseGeometry.computeVertexNormals();

const porcelain = new THREE.MeshPhysicalMaterial({
  color: 0x8fd9d1,
  roughness: 0.19,
  metalness: 0,
  clearcoat: 0.72,
  clearcoatRoughness: 0.14,
  sheen: 0.2,
  sheenColor: new THREE.Color(0xc9fff7),
  envMapIntensity: 1.15,
  side: THREE.DoubleSide
});
const vase = new THREE.Mesh(vaseGeometry, porcelain);
vase.castShadow = true;
vase.receiveShadow = true;
vase.scale.set(.84, 1, .84);
vase.rotation.y = -.15;
scene.add(vase);

// Near-black studio floor, matching the reference's low-key presentation.
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(36, 36),
  new THREE.ShadowMaterial({ color: 0x000000, opacity: .38, transparent: true })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -.015;
floor.receiveShadow = true;
scene.add(floor);

scene.add(new THREE.HemisphereLight(0xe8fffc, 0x010405, 1.25));
const key = new THREE.DirectionalLight(0xf3fffd, 3.8);
key.position.set(-5, 9, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 22;
key.shadow.camera.left = key.shadow.camera.bottom = -5;
key.shadow.camera.right = key.shadow.camera.top = 5;
key.shadow.bias = -.00015;
scene.add(key);

const fill = new THREE.PointLight(0x83fff0, 20, 18, 2);
fill.position.set(4, 4.5, 5);
scene.add(fill);
const rim = new THREE.PointLight(0xdffff9, 12, 16, 2);
rim.position.set(3, 6, -4);
scene.add(rim);

// Large cards create the long, milky highlights characteristic of glazed porcelain.
const studio = new THREE.Scene();
studio.background = new THREE.Color(0x010506);
function card(w,h,color,intensity,x,y,z) {
  const material = new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide, toneMapped: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w,h), material);
  mesh.position.set(x,y,z); mesh.lookAt(0,3,0); studio.add(mesh);
}
card(3,8,0xffffff,8,-5,4,4);
card(2,7,0x9ffff2,5,5,4,2);
card(5,2,0xffffff,4,0,8,-2);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(studio, .035).texture;
pmrem.dispose();

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

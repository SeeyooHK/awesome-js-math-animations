<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radial Choreography</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
  <script>
    function setup() {
      createCanvas(600, 760)
      pixelDensity(min(devicePixelRatio, 2))
      frameRate(60)
      strokeCap(ROUND)
      strokeJoin(ROUND)
    }

    const figureCount = 48
    const spokeCount = 12
    const cycleDuration = 22.75
    const gestures = [
      [[-11, -4, -.2], [10, 8, 1.45]],
      [[-23, -2, -.05], [8, 17, 1.55]],
      [[-13, -15, -.85], [14, -13, -2.25]],
      [[-22, 2, .08], [22, 2, 3.05]],
      [[-8, 10, .95], [9, 10, 2.15]],
      [[-11, -4, -.2], [10, 8, 1.45]]
    ]

    function hand(x, y, angle, opacity) {
      push()
      translate(x, y)
      rotate(angle)
      stroke(232, 172, 135, opacity * .82)
      strokeWeight(3.4)
      line(-6.5, 0, 0, 0)
      noStroke()
      fill(244, 189, 151, opacity)
      ellipse(0, 0, 5.5, 4.2)
      stroke(250, 201, 166, opacity)
      strokeWeight(1.15)
      for (let finger = -1; finger <= 1; finger++)
        line(1.5, finger * 1.05, 6.2, finger * 1.45)
      pop()
    }

    function gestureAt(time) {
      const gestureDuration = 4.8
      const progress = (time % gestureDuration) / gestureDuration * (gestures.length - 1)
      const index = floor(progress)
      const amount = .5 - .5 * cos((progress - index) * PI)
      const from = gestures[index]
      const to = gestures[index + 1]

      return from.map((handPose, handIndex) =>
        handPose.map((value, valueIndex) => lerp(value, to[handIndex][valueIndex], amount))
      )
    }

    function figure(time, opacity) {
      const [left, right] = gestureAt(time)
      const nod = sin(time * 2.6) * 1.2

      drawingContext.shadowColor = `rgba(255, 183, 138, ${opacity / 1000})`
      drawingContext.shadowBlur = 4
      noStroke()
      fill(219, 158, 120, opacity)
      ellipse(0, nod, 7.5, 9.5)
      fill(45, 25, 21, opacity * .7)
      arc(0, nod - 1.5, 7.7, 7, PI, TWO_PI)

      hand(left[0], left[1], left[2], opacity)
      hand(right[0], right[1], right[2], opacity)
      drawingContext.shadowBlur = 0
    }

    function formationPoint(index, phase) {
      const ring = floor(index / spokeCount)
      const slot = index % spokeCount
      const spokeAngle = TWO_PI * slot / spokeCount
      const twist = .34 * sin(phase) - .22 * sin(phase * 2 + .4)
      const angle = spokeAngle + ring * twist
      const spread = .88 + .14 * sin(phase - .6)
      const ringWave = 15 * sin(phase * 2 - ring * .72)
      const petals = 18 * sin(phase * 1.5) * sin(spokeAngle * 6 + phase + ring * .45)
      const radius = (54 + ring * 51) * spread + ringWave + petals

      return {
        x: cos(angle) * radius,
        y: sin(angle) * radius,
        angle: angle + HALF_PI + .16 * sin(phase * 2 + ring * .65),
        size: .78 + ring * .085
      }
    }

    function drawFormation(cycleTime, elapsedTime) {
      const phase = TWO_PI * cycleTime / cycleDuration

      for (let index = 0; index < figureCount; index++) {
        const point = formationPoint(index, phase)
        const pulse = .96 + .05 * sin(elapsedTime * 1.4 - floor(index / spokeCount) * .4)

        push()
        translate(point.x, point.y)
        rotate(point.angle)
        scale(point.size * pulse)
        figure(elapsedTime, 165 + 85 * index / figureCount)
        pop()
      }
    }

    function draw() {
      const elapsedTime = millis() / 1000
      const cycleTime = elapsedTime % cycleDuration
      background(0)
      translate(width / 2, height / 2 - 8)
      rotate(elapsedTime * .045)
      drawFormation(cycleTime, elapsedTime)

      noStroke()
      fill(0)
      circle(0, 0, 32)
    }
  </script>
</body>
</html>

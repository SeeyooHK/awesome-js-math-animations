<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flowing Filament Membrane</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f1efea; }
    canvas { display: block; width: 100%; height: 100%; }
    #error {
      display: none;
      position: fixed;
      inset: 0;
      place-items: center;
      color: #30333c;
      font: 14px/1.5 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Translucent colored filaments folding into a flowing membrane"></canvas>
  <div id="error" role="alert">This animation needs WebGL 2.</div>
  <script>
    (() => {
      const canvas = document.querySelector('#scene');
      const error = document.querySelector('#error');
      const gl = canvas.getContext('webgl2', {
        alpha: false,
        antialias: false,
        depth: false,
        powerPreference: 'high-performance'
      });

      if (!gl) {
        canvas.hidden = true;
        error.style.display = 'grid';
        return;
      }

      const strandsPerSheet = 1300;
      const sheetCount = 6;
      const segmentCount = 70;
      const lineCount = strandsPerSheet * sheetCount * segmentCount;

      const vertexSource = `#version 300 es
        precision highp float;
        uniform vec2 resolution;
        uniform float time;
        out vec4 filament;

        #define PI 3.14159265359
        #define TAU 6.28318530718

        float hash(float n) {
          return fract(sin(n * 91.3458) * 47453.5453);
        }

        mat2 rotate2(float angle) {
          float c = cos(angle), s = sin(angle);
          return mat2(c, -s, s, c);
        }

        float irisBase(int id) {
          if (id == 0) return 0.92;
          if (id == 1) return 1.57;
          if (id == 2) return 2.22;
          if (id == 3) return 3.42;
          if (id == 4) return 4.71;
          return 6.00;
        }

        float irisDrift(int id) {
          if (id == 0) return 0.34;
          if (id == 1) return 0.04;
          if (id == 2) return -0.30;
          if (id == 3) return -0.26;
          if (id == 4) return 0.02;
          return 0.30;
        }

        vec3 membrane(float u, float v, float sheet, float seed, float t) {
          float cycle = t * 0.185;
          float fall = 0.5 - 0.5*cos(TAU*mod(t, 18.0)/18.0);
          int petal = int(sheet);
          float breath = sin(cycle * 1.37 + sheet * 1.9);
          float spread = (petal < 3 ? 0.74 : 1.04)
            + 0.15*sin(cycle*0.81 + sheet*2.1);
          float base = irisBase(petal);
          base += 0.08*sin(cycle*0.63 + sheet*1.7);
          base += fall*irisDrift(petal);

          float open = smoothstep(0.0, 0.16, v);
          float angle = base
            + (u - 0.5) * spread * (0.20 + 1.16*v)
            + (v - 0.34) * (0.62*sin(cycle*0.47 + sheet*1.31))
            + 0.12*sin(3.4*v + cycle + sheet);

          float edge = pow(sin(PI*u), 0.20);
          float radius = (0.012 + 1.02*pow(v, 0.82)) * (0.86 + 0.15*edge);
          radius *= petal < 3 ? 0.78 : 1.03;
          radius *= 1.0 + 0.065*sin(TAU*u*2.0 + cycle*1.2 + sheet);

          vec3 p = vec3(cos(angle), sin(angle), 0.0) * radius;
          p.y *= 1.18;

          float fold = sin(PI*v) * (
              0.31*sin(TAU*u + cycle*0.91 + sheet*1.6)
            + 0.18*sin(2.0*angle - cycle*0.73)
          );
          p.z = fold + 0.22*breath*sin(PI*v)*cos(angle*1.5);
          p.xy += 0.055*vec2(
            sin(cycle*1.1 + sheet),
            cos(cycle*0.9 + sheet*1.2)
          ) * open;
          p.x += 0.16*p.y + 0.10*sin(1.7*p.y + cycle*0.72);
          p.y += 0.045*sin(1.4*p.x - cycle*0.51);

          // The iris is fully formed at the start. Its petals then peel away
          // and fall before the cosine cycle gently assembles it again.
          float loose = fall*smoothstep(0.08, 1.0, v);
          p.x += loose*irisDrift(petal)*(0.32 + 0.26*v);
          p.y -= loose*(petal < 3 ? 0.34 : 0.24)*(0.35 + 0.65*v);
          p.z += loose*(0.20 + 0.18*sin(sheet*2.4))*sin(PI*v);

          // Tiny independent offsets keep the membrane fibrous instead of geometric.
          p += (seed - 0.5) * vec3(0.010, 0.010, 0.020) * smoothstep(0.08, 0.70, v);
          return p;
        }

        void main() {
          int segmentVertex = gl_VertexID;
          int segment = (segmentVertex / 2) % ${segmentCount};
          int strand = (segmentVertex / 2) / ${segmentCount};
          int sheetIndex = strand / ${strandsPerSheet};
          int strandIndex = strand - sheetIndex * ${strandsPerSheet};

          float endpoint = float(segmentVertex & 1);
          float v = (float(segment) + endpoint) / float(${segmentCount});
          float seed = hash(float(strandIndex) + float(sheetIndex)*317.0);
          float u = (float(strandIndex) + 0.35*seed) / float(${strandsPerSheet} - 1);
          float sheet = float(sheetIndex);

          vec3 p = membrane(u, v, sheet, seed, time);
          p.xz = rotate2(0.12*sin(time*0.071)) * p.xz;
          p.yz = rotate2(-0.11 + 0.15*sin(time*0.057 + 1.0)) * p.yz;
          p.xy = rotate2(0.06*sin(time*0.049)) * p.xy;

          float perspective = 1.0 / (1.32 - 0.19*p.z);
          vec2 screen = p.xy * perspective;
          screen.x *= resolution.y / resolution.x;
          screen *= 1.08;
          gl_Position = vec4(screen, 0.0, 1.0);

          vec3 deepViolet = vec3(0.12, 0.035, 0.34);
          vec3 royalPurple = vec3(0.31, 0.13, 0.68);
          vec3 irisBlue = vec3(0.27, 0.43, 0.86);
          vec3 lavender = vec3(0.72, 0.65, 0.94);
          vec3 goldenYellow = vec3(1.00, 0.62, 0.08);
          vec3 cream = vec3(0.98, 0.90, 0.68);

          float throat = exp(-pow((v - 0.30) / 0.20, 2.0));
          throat *= exp(-pow((u - 0.50) / 0.25, 2.0));
          float rim = smoothstep(0.58, 1.0, v);
          float petalTone = 0.5 + 0.5*sin(TAU*u + sheet*1.45);
          vec3 outer = mix(irisBlue, lavender, 0.25 + 0.62*petalTone);
          vec3 color = mix(deepViolet, royalPurple, smoothstep(0.04, 0.35, v));
          color = mix(color, outer, smoothstep(0.28, 0.92, v));

          float vein = pow(0.5 + 0.5*sin(58.0*u + 5.0*sin(4.0*v + sheet)), 8.0);
          vein *= smoothstep(0.18, 0.78, v) * (1.0 - 0.48*rim);
          color = mix(color, deepViolet, vein*0.58);
          color = mix(color, goldenYellow, throat*0.92);
          float signal = throat*exp(-pow((v - 0.44) / 0.12, 2.0));
          color = mix(color, cream, signal*0.52);
          color = mix(color, lavender, rim*0.30);

          float sideFade = pow(sin(PI*u), 0.32);
          float endFade = smoothstep(0.0, 0.055, v) * (1.0 - 0.28*smoothstep(0.94, 1.0, v));
          float depthFade = 0.62 + 0.38*smoothstep(-0.35, 0.38, p.z);
          float alpha = 0.058 * sideFade * endFade * depthFade;
          alpha *= 1.0 + 0.35*throat + 0.22*vein;
          filament = vec4(color, alpha);
        }
      `;

      const fragmentSource = `#version 300 es
        precision highp float;
        in vec4 filament;
        out vec4 fragColor;
        void main() {
          fragColor = filament;
        }
      `;

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(shader));
        }
        return shader;
      }

      try {
        const program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program));
        }

        gl.useProgram(program);
        gl.bindVertexArray(gl.createVertexArray());
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

        const resolution = gl.getUniformLocation(program, 'resolution');
        const time = gl.getUniformLocation(program, 'time');
        const start = performance.now();

        function frame(now) {
          const ratio = Math.min(devicePixelRatio || 1, 1.5);
          const width = Math.round(canvas.clientWidth * ratio);
          const height = Math.round(canvas.clientHeight * ratio);
          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
            gl.viewport(0, 0, width, height);
          }

          gl.clearColor(0.955, 0.950, 0.968, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.uniform2f(resolution, width, height);
          gl.uniform1f(time, (now - start) * 0.001);
          gl.drawArrays(gl.LINES, 0, lineCount * 2);
          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      } catch (message) {
        console.error(message);
        canvas.hidden = true;
        error.textContent = 'The filament shader could not be started on this device.';
        error.style.display = 'grid';
      }
    })();
  </script>
</body>
</html>

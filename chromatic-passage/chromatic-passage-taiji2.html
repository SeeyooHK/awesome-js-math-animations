<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chromatic Passage</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #08050d; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    .core {
      position: fixed; left: 50%; top: 50%; z-index: 1; pointer-events: none;
      width: min(24.3vw, 290px); aspect-ratio: 1; transform: translate(-50%, -50%);
      background: transparent;
      filter: drop-shadow(0 0 22px rgba(255, 102, 32, .32)) drop-shadow(0 0 42px rgba(191, 45, 255, .18));
    }
    .core canvas { width: 100%; height: 100%; background: transparent; }
    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: .11;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.75'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }
    .intro {
      position: fixed; left: clamp(24px, 5vw, 72px); top: clamp(24px, 6vw, 72px);
      z-index: 3; pointer-events: none; color: #fff8ef;
      transition: opacity .8s ease, transform .8s ease;
    }
    .intro.hidden { opacity: 0; transform: translateY(-8px); }
    .eyebrow { margin: 0 0 10px; font-size: 10px; letter-spacing: .34em; text-transform: uppercase; opacity: .62; }
    h1 { margin: 0; max-width: 520px; font-family: Georgia, serif; font-weight: 400; font-size: clamp(36px, 7vw, 88px); line-height: .88; letter-spacing: -.055em; }
    .hint { position: fixed; right: 24px; bottom: 22px; z-index: 3; color: #fff8ef; opacity: .52; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; pointer-events: none; }
    .controls { position: fixed; left: 24px; bottom: 18px; z-index: 4; display: flex; gap: 8px; }
    button {
      border: 1px solid rgba(255,255,255,.18); border-radius: 999px; background: rgba(10,6,16,.28);
      backdrop-filter: blur(10px); color: rgba(255,248,239,.76); padding: 9px 13px; cursor: pointer;
      font: 10px/1 system-ui, sans-serif; letter-spacing: .15em; text-transform: uppercase;
    }
    button:hover, button:focus-visible { color: white; border-color: rgba(255,255,255,.45); outline: none; }
    @media (max-width: 600px) {
      .core { width: min(43.2vw, 243px); }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="intro" id="intro">
    <p class="eyebrow">An endless study in light</p>
    <h1>Chromatic<br>Passage</h1>
  </div>
  <div class="controls"><button id="pause" type="button">Pause</button></div>
  <div class="hint">Move to drift · scroll to accelerate</div>
  <div class="grain"></div>
  <div class="core" id="taiji" aria-hidden="true"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js';

    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x08050d, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x08050d, 0.026);
    const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, .1, 120);
    camera.position.z = 8;

    const count = innerWidth < 700 ? 18000 : 34000;
    const length = 100;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    const seeds = new Float32Array(count);
    const palette = [
      new THREE.Color('#f15c45'), new THREE.Color('#ffad66'), new THREE.Color('#f6d78b'),
      new THREE.Color('#ae63b8'), new THREE.Color('#65499b'), new THREE.Color('#45a7a2'),
      new THREE.Color('#467fba'), new THREE.Color('#df7892')
    ];

    for (let i = 0; i < count; i++) {
      const t = Math.random();
      const z = 9 - t * length;
      const phase = Math.random() * Math.PI * 2 + z * .035;
      const band = Math.random();
      const radius = 5.2 + Math.pow(Math.random(), 1.8) * 8.5 + Math.sin(z * .085 + band * 9) * .65;
      positions[i * 3] = Math.cos(phase) * radius;
      positions[i * 3 + 1] = Math.sin(phase) * radius;
      positions[i * 3 + 2] = z;
      const c = palette[Math.floor((phase / (Math.PI * 2) * palette.length + palette.length) % palette.length)].clone();
      c.lerp(palette[(Math.floor(Math.random() * palette.length) + 1) % palette.length], .16);
      colors.set([c.r, c.g, c.b], i * 3);
      sizes[i] = 2.2 + Math.random() * 6.5;
      seeds[i] = Math.random();
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
    geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));

    const material = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      uniforms: { uTime: { value: 0 }, uTravel: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
      vertexShader: `
        attribute float aSize; attribute float aSeed; varying vec3 vColor; varying float vSeed;
        uniform float uTime; uniform float uTravel; uniform float uPixelRatio;
        void main() {
          vec3 p = position;
          p.z = 9.0 - mod(9.0 - p.z - uTravel, 100.0);
          float twist = sin(p.z * .065 + uTime * .22 + aSeed * 6.283) * .12;
          mat2 rot = mat2(cos(twist), -sin(twist), sin(twist), cos(twist));
          p.xy = rot * p.xy;
          p.xy += vec2(sin(p.z * .052 + uTime * .19), cos(p.z * .044 - uTime * .16)) * .38;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = min(28.0, aSize * uPixelRatio * (20.0 / max(3.0, -mv.z)));
          vColor = color; vSeed = aSeed;
        }
      `,
      fragmentShader: `
        varying vec3 vColor; varying float vSeed;
        void main() {
          vec2 p = gl_PointCoord - .5;
          float angle = (vSeed - .5) * .9;
          p = mat2(cos(angle), -sin(angle), sin(angle), cos(angle)) * p;
          p.x *= .42;
          float d = length(p);
          float body = smoothstep(.49, .08, d);
          float bristle = .76 + .24 * sin((p.y + vSeed) * 70.0);
          float alpha = body * bristle * .82;
          if (alpha < .025) discard;
          vec3 ink = vColor * (1.08 + .3 * smoothstep(.45, 0.0, d));
          gl_FragColor = vec4(ink, alpha);
        }
      `
    });

    const tunnel = new THREE.Points(geometry, material);
    tunnel.rotation.z = .2;
    scene.add(tunnel);

    const taijiHost = document.querySelector('#taiji');
    const taijiRenderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, premultipliedAlpha: true });
    taijiRenderer.setClearColor(0x000000, 0);
    taijiRenderer.outputColorSpace = THREE.SRGBColorSpace;
    taijiHost.append(taijiRenderer.domElement);
    const taijiScene = new THREE.Scene();
    const taijiCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const taijiMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
      `,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;
        uniform float uTime;
        #define PI 3.14159265359

        float hash21(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash21(i), hash21(i + vec2(1,0)), f.x),
                     mix(hash21(i + vec2(0,1)), hash21(i + 1.0), f.x), f.y);
        }
        float fbm(vec2 p) {
          float value = 0.0, amplitude = .5;
          mat2 turn = mat2(.82, -.57, .57, .82);
          for (int i = 0; i < 6; i++) {
            value += amplitude * noise(p);
            p = turn * p * 2.03 + 7.1;
            amplitude *= .5;
          }
          return value;
        }
        float lobe(float angle, float center, float width) {
          float d = atan(sin(angle - center), cos(angle - center));
          return exp(-d * d / (width * width));
        }
        vec3 spectral(float angle) {
          vec3 red = vec3(.946,.361,.271), orange = vec3(1.0,.678,.4), gold = vec3(.965,.843,.545);
          vec3 violet = vec3(.682,.388,.722), indigo = vec3(.396,.286,.608);
          vec3 cyan = vec3(.271,.655,.635), blue = vec3(.275,.498,.729);
          float wr=lobe(angle,.15,.64), wo=lobe(angle,.72,.56), wg=lobe(angle,PI*.5,.58);
          float wv=lobe(angle,PI,.72), wi=lobe(angle,-2.45,.62), wc=lobe(angle,-PI*.5,.5), wb=lobe(angle,-.72,.55);
          return (red*wr+orange*wo+gold*wg+violet*wv+indigo*wi+cyan*wc+blue*wb)
               / max(.001, wr+wo+wg+wv+wi+wc+wb);
        }
        void main() {
          vec2 p = (vUv - .5) * 2.0;
          float rotation = uTime * .28;
          p = mat2(cos(rotation), -sin(rotation), sin(rotation), cos(rotation)) * p;
          float radius = length(p), angle = atan(p.y, p.x);
          const float R = .555;
          float disc = 1.0 - smoothstep(R-.002, R+.002, radius);
          float n = fbm(p*18.0 + vec2(fbm(p*34.0), fbm(p*29.0+9.0))*3.0);
          float fine = fbm(p*62.0 + n*5.0);
          float halfR = R*.5;
          float curve = sqrt(max(0.0, halfR*halfR - pow(abs(p.y)-halfR, 2.0)));
          float boundaryX = sign(p.y) * curve;
          float goldSide = smoothstep(-.003, .003, p.x-boundaryX);
          vec2 upperCenter = vec2(0.0,R*.5), lowerCenter = vec2(0.0,-R*.5);
          float upperLight = exp(-dot(p-upperCenter,p-upperCenter)/(R*R*.22));
          float lowerLight = exp(-dot(p-lowerCenter,p-lowerCenter)/(R*R*.19));
          vec3 purple = mix(vec3(.025,.004,.045), vec3(.49,.055,.64), upperLight*.78);
          vec3 amber = mix(vec3(.025,.006,.012), vec3(1.0,.48,.055), lowerLight*.9);
          vec3 color = mix(purple, amber, goldSide);
          float filaments = pow(smoothstep(.48,.74,fine),2.0) * (.35+n);
          color += mix(vec3(.72,.12,.9),vec3(1.0,.73,.18),goldSide)*filaments*.62;
          color *= (.54 + .52*(1.0-radius/R))*disc;
          float splitGlow = exp(-abs(p.x-boundaryX)*185.0)*disc;
          color += mix(vec3(1.0,.12,.72),vec3(1.0,.73,.2),smoothstep(-.08,.08,-p.y))*splitGlow*1.35;
          float rimDistance = abs(radius-R);
          color += vec3(1.0,.32,.64)*exp(-rimDistance*105.0)*.7;
          color += vec3(1.0,.78,.28)*exp(-rimDistance*230.0)*1.25;
          float roughRim = pow(smoothstep(.47,.72,fbm(vec2(angle*10.0,4.0))),2.0);
          color += spectral(angle)*exp(-abs(radius-R*1.055)*80.0)*roughRim;
          float wellR=R*.115, topWell=length(p-upperCenter), bottomWell=length(p-lowerCenter);
          color += vec3(1.0,.56,.09)*exp(-abs(topWell-wellR)*270.0)*1.8;
          color += vec3(.78,.22,.92)*exp(-abs(bottomWell-wellR)*270.0)*1.8;
          color = mix(color,vec3(.08,.006,.012)+vec3(1.0,.52,.055)*(1.0-topWell/wellR)*.95,
                      1.0-smoothstep(wellR*.76,wellR*.84,topWell));
          color = mix(color,vec3(.055,.006,.08)+vec3(.68,.22,.86)*(1.0-bottomWell/wellR)*.92,
                      1.0-smoothstep(wellR*.76,wellR*.84,bottomWell));
          color *= 1.0-.76*(1.0-smoothstep(wellR*.18,wellR*.34,min(topWell,bottomWell)));
          color = pow(1.0-exp(-color*1.28),vec3(.88));
          float alpha = 1.0-smoothstep(R*1.08,R*1.18,radius);
          gl_FragColor = vec4(color*alpha,alpha);
        }
      `
    });
    taijiScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), taijiMaterial));

    function resizeTaiji() {
      const size = Math.max(1, Math.round(taijiHost.clientWidth));
      taijiRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      taijiRenderer.setSize(size, size, false);
    }
    resizeTaiji();

    const pointer = new THREE.Vector2();
    const target = new THREE.Vector2();
    let velocity = reducedMotion ? .35 : 1.0;
    let speedImpulse = 0;
    let paused = reducedMotion;
    const clock = new THREE.Clock();
    const pauseButton = document.querySelector('#pause');

    function setPointer(x, y) {
      target.set((x / innerWidth - .5) * 2, (y / innerHeight - .5) * -2);
      document.querySelector('#intro').classList.add('hidden');
    }
    addEventListener('pointermove', e => setPointer(e.clientX, e.clientY), { passive: true });
    addEventListener('wheel', e => { speedImpulse = Math.min(4, speedImpulse + Math.abs(e.deltaY) * .005); }, { passive: true });
    pauseButton.addEventListener('click', () => {
      paused = !paused;
      pauseButton.textContent = paused ? 'Play' : 'Pause';
    });
    addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); pauseButton.click(); } });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7)); renderer.setSize(innerWidth, innerHeight);
      material.uniforms.uPixelRatio.value = renderer.getPixelRatio();
      resizeTaiji();
    });

    let elapsed = 0;
    let travel = 0;
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), .05);
      if (!paused) elapsed += dt;
      pointer.lerp(target, 1 - Math.pow(.001, dt));
      speedImpulse *= Math.pow(.05, dt);
      velocity += ((paused ? 0 : 1 + speedImpulse) - velocity) * (1 - Math.pow(.008, dt));
      camera.position.x += (pointer.x * 1.5 - camera.position.x) * (1 - Math.pow(.025, dt));
      camera.position.y += (pointer.y * 1.05 - camera.position.y) * (1 - Math.pow(.025, dt));
      camera.rotation.z += (-pointer.x * .035 - camera.rotation.z) * (1 - Math.pow(.02, dt));
      if (!paused) travel = (travel + dt * velocity * 5.8) % length;
      tunnel.rotation.z = .2 + Math.sin(elapsed * .08) * .12;
      material.uniforms.uTime.value = elapsed;
      material.uniforms.uTravel.value = travel;
      taijiMaterial.uniforms.uTime.value = elapsed;
      renderer.render(scene, camera);
      taijiRenderer.render(taijiScene, taijiCamera);
    }
    pauseButton.textContent = paused ? 'Play' : 'Pause';
    animate();
  </script>
</body>
</html>

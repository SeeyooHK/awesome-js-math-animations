<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetic Field Star</title>
<style>
  html, body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; touch-action: none; }
  #status { position: absolute; margin: 24px; color: #bbb; font: 14px sans-serif; }
</style>
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="status">Loading magnetic field…</div>
<!-- Visual reference: https://jeonghopark.de/magnetfield_v02/ by Jeong Ho Park.
     Readable reimplementation: WebGL surface shader + CPU particle advection.
     Drag to orbit, scroll / pinch to zoom. Only Three.js is loaded externally. -->
<script type="module">
const status = document.querySelector('#status');
try {
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');

  // Adjust these parameters to change the field's density and motion.
  const RADIUS = 5;
  const STAR_INNER_RADIUS = RADIUS * 0.45;
  const STAR_DEPTH = 1.6;
  const POLE_COUNT = 70;
  const PARTICLE_COUNT = 6500;
  const TRAIL_LENGTH = 24;
  const FIXED_STEP = 1 / 60;
  const MAX_AGE = 6;
  const scene = new THREE.Scene();
  // Rotate the surface, poles, and particle histories together in local space.
  const star = new THREE.Group();
  scene.add(star);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
  camera.position.z = 20;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  document.body.appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 8;
  controls.maxDistance = 55;
  controls.enablePan = false;

  // Map a unit direction onto a plump five-pointed star. The XY outline is
  // the intersection of a radial ray with one of the ten straight star edges.
  // Sharing this map keeps both the mesh and moving poles on the same surface.
  function starPosition(direction, target) {
    const sectorAngle = Math.PI / 5;
    const angle = ((Math.atan2(direction.y, direction.x) - Math.PI / 2)
      % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    const sector = Math.floor(angle / sectorAngle);
    const startAngle = sector * sectorAngle;
    const startRadius = sector % 2 === 0 ? RADIUS : STAR_INNER_RADIUS;
    const endRadius = sector % 2 === 0 ? STAR_INNER_RADIUS : RADIUS;
    const ax = Math.cos(startAngle) * startRadius;
    const ay = Math.sin(startAngle) * startRadius;
    const bx = Math.cos(startAngle + sectorAngle) * endRadius;
    const by = Math.sin(startAngle + sectorAngle) * endRadius;
    const radius = (ax * by - ay * bx)
      / (Math.cos(angle) * (by - ay) - Math.sin(angle) * (bx - ax));
    return target.set(direction.x * radius, direction.y * radius, direction.z * STAR_DEPTH);
  }

  const starGeometry = new THREE.SphereGeometry(1, 192, 128);
  const vertex = new THREE.Vector3();
  const starVertices = starGeometry.attributes.position;
  for (let i = 0; i < starVertices.count; i++) {
    vertex.fromBufferAttribute(starVertices, i).normalize();
    starPosition(vertex, vertex);
    starVertices.setXYZ(i, vertex.x, vertex.y, vertex.z);
  }
  starGeometry.computeVertexNormals();
  starGeometry.computeBoundingSphere();

  const poles = [];
  const poleUniforms = [];
  const positivePoles = [];
  const markerGeometry = new THREE.SphereGeometry(1, 12, 8);
  const positiveMaterial = new THREE.MeshBasicMaterial({ color: 0xffdc73 });
  const negativeMaterial = new THREE.MeshBasicMaterial({ color: 0xd99a22 });
  for (let i = 0; i < POLE_COUNT; i++) {
    const strength = (i < POLE_COUNT / 2 ? 1 : -1) * (0.15 + Math.random() * 0.85);
    const direction = new THREE.Vector3().randomDirection();
    const position = starPosition(direction, new THREE.Vector3());
    const marker = new THREE.Mesh(markerGeometry, strength > 0 ? positiveMaterial : negativeMaterial);
    marker.scale.setScalar(0.07 + Math.abs(strength) * 0.02);
    star.add(marker);
    const pole = { direction, position, strength, marker,
      axis: new THREE.Vector3().randomDirection(), speed: 0.06 + Math.random() * 0.28 };
    poles.push(pole);
    poleUniforms.push(new THREE.Vector4(position.x, position.y, position.z, strength));
    if (strength > 0) positivePoles.push(pole);
  }

  // Contours of scalar potential V = sum(q / distance), evaluated on the star.
  // Screen-space derivatives keep the thin contours smooth at every zoom level.
  const surface = new THREE.Mesh(starGeometry,
    new THREE.ShaderMaterial({
      uniforms: { poles: { value: poleUniforms } },
      vertexShader: `
        varying vec3 fieldPosition;
        varying vec3 viewNormal;
        varying vec3 viewDirection;
        void main() {
          fieldPosition = position;
          viewNormal = normalMatrix * normal;
          vec4 viewPosition = modelViewMatrix * vec4(position, 1.0);
          viewDirection = -viewPosition.xyz;
          gl_Position = projectionMatrix * viewPosition;
        }`,
      fragmentShader: `
        uniform vec4 poles[${POLE_COUNT}];
        varying vec3 fieldPosition;
        varying vec3 viewNormal;
        varying vec3 viewDirection;
        void main() {
          float potential = 0.0;
          for (int i = 0; i < ${POLE_COUNT}; i++) {
            potential += poles[i].w / max(distance(fieldPosition, poles[i].xyz), 0.001);
          }
          float bands = potential / 0.07;
          float edge = min(fract(bands), 1.0 - fract(bands));
          float width = max(fwidth(bands), 0.00001);
          float contour = (1.0 - smoothstep(width * 0.5, width * 1.5, edge))
                        * (1.0 - smoothstep(0.3, 0.6, width));
          vec3 normal = normalize(viewNormal);
          vec3 light = normalize(vec3(-0.5, 0.8, 1.0));
          float diffuse = max(dot(normal, light), 0.0);
          vec3 halfway = normalize(light + normalize(viewDirection));
          float highlight = pow(max(dot(normal, halfway), 0.0), 40.0);
          vec3 gold = vec3(0.83, 0.53, 0.09) * (0.38 + 0.62 * diffuse)
                    + vec3(0.5, 0.36, 0.13) * highlight;
          vec3 ink = vec3(0.025, 0.32, 1.0);
          gl_FragColor = vec4(mix(gold, ink, contour * 0.94), 1.0);
        }`
    }));
  star.add(surface);

  // A real 3D lattice gives the same vanishing lines when the camera orbits.
  const gridVertices = [];
  for (let a = -60; a <= 60; a += 5) {
    for (let b = -60; b <= 60; b += 5) {
      gridVertices.push(-60,a,b, 60,a,b, a,-60,b, a,60,b, a,b,-60, a,b,60);
    }
  }
  const gridGeometry = new THREE.BufferGeometry();
  gridGeometry.setAttribute('position', new THREE.Float32BufferAttribute(gridVertices, 3));
  scene.add(new THREE.LineSegments(gridGeometry, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    vertexShader: `
      varying vec3 gridPosition;
      void main() {
        gridPosition = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 gridPosition;
      void main() {
        float radius = length(gridPosition);
        float fade = smoothstep(12.0, 22.0, radius) * (1.0 - smoothstep(30.0, 60.0, radius));
        gl_FragColor = vec4(0.12, 0.32, 0.72, fade * 0.14);
      }`
  })));

  // Each particle owns a circular history buffer, avoiding per-frame allocations.
  const positions = new Float32Array(PARTICLE_COUNT * 3);
  const ages = new Float32Array(PARTICLE_COUNT);
  const history = new Float32Array(PARTICLE_COUNT * TRAIL_LENGTH * 3);
  const trailVertices = new Float32Array(PARTICLE_COUNT * (TRAIL_LENGTH - 1) * 6);
  const trailColors = new Float32Array(trailVertices.length);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(trailVertices, 3).setUsage(THREE.DynamicDrawUsage));
  geometry.setAttribute('color', new THREE.BufferAttribute(trailColors, 3).setUsage(THREE.DynamicDrawUsage));
  const trails = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  trails.frustumCulled = false;
  star.add(trails);
  const headsGeometry = new THREE.BufferGeometry();
  headsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
  const heads = new THREE.Points(headsGeometry, new THREE.PointsMaterial({
    color: 0x3b91ff, size: 0.025, transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  heads.frustumCulled = false;
  star.add(heads);

  function respawn(index) {
    const pole = positivePoles[index % positivePoles.length];
    const offset = index * 3;
    positions[offset] = pole.position.x + (Math.random() - 0.5) * 0.2;
    positions[offset + 1] = pole.position.y + (Math.random() - 0.5) * 0.2;
    positions[offset + 2] = pole.position.z + (Math.random() - 0.5) * 0.2;
    ages[index] = 0;
    // Clear old history so respawning never draws a line across the star.
    for (let sample = 0; sample < TRAIL_LENGTH; sample++) {
      const h = (index * TRAIL_LENGTH + sample) * 3;
      history[h] = positions[offset];
      history[h + 1] = positions[offset + 1];
      history[h + 2] = positions[offset + 2];
    }
  }
  for (let i = 0; i < PARTICLE_COUNT; i++) { respawn(i); ages[i] = Math.random() * MAX_AGE; }

  let historyHead = 0;
  let stepCount = 0;
  function simulate() {
    poles.forEach((pole, i) => {
      pole.direction.applyAxisAngle(pole.axis, pole.speed * FIXED_STEP).normalize();
      starPosition(pole.direction, pole.position);
      pole.marker.position.copy(pole.position).multiplyScalar(1.01);
      poleUniforms[i].set(pole.position.x, pole.position.y, pole.position.z, pole.strength);
    });
    const recordHistory = stepCount++ % 4 === 0;
    if (recordHistory) historyHead = (historyHead + 1) % TRAIL_LENGTH;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = i * 3;
      const x = positions[p], y = positions[p + 1], z = positions[p + 2];
      let fx = 0, fy = 0, fz = 0, captured = false;
      for (let j = 0; j < POLE_COUNT; j++) {
        const pole = poleUniforms[j];
        const dx = x - pole.x, dy = y - pole.y, dz = z - pole.z;
        const distanceSquared = Math.max(dx*dx + dy*dy + dz*dz, 0.000001);
        if (pole.w < 0 && distanceSquared < 0.0225) captured = true;
        const force = pole.w / (distanceSquared * Math.sqrt(distanceSquared));
        fx += dx * force; fy += dy * force; fz += dz * force;
      }
      const length = Math.hypot(fx, fy, fz);
      ages[i] += FIXED_STEP;
      if (captured || ages[i] > MAX_AGE || x*x+y*y+z*z > 126 || length < 1e-10) {
        respawn(i);
      } else {
        const speed = 1.2 * FIXED_STEP / length;
        positions[p] += fx * speed;
        positions[p + 1] += fy * speed;
        positions[p + 2] += fz * speed;
      }
      if (recordHistory) {
        const h = (i * TRAIL_LENGTH + historyHead) * 3;
        history[h] = positions[p]; history[h + 1] = positions[p + 1]; history[h + 2] = positions[p + 2];
      }
    }
  }

  function updateTrails() {
    let output = 0;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const age = ages[i] / MAX_AGE;
      const brightness = Math.pow(1 - age, 1.5) * Math.min(ages[i] * 5, 1);
      // Blue throughout the trajectory, with a brighter azure head.
      const red = 0.025;
      const green = 0.42 - age * 0.18;
      for (let sample = 0; sample < TRAIL_LENGTH - 1; sample++) {
        for (let endpoint = 0; endpoint < 2; endpoint++) {
          const back = sample + endpoint;
          const h = (i * TRAIL_LENGTH + (historyHead - back + TRAIL_LENGTH) % TRAIL_LENGTH) * 3;
          const fade = brightness * (1 - back / (TRAIL_LENGTH - 1));
          const p = back === 0 ? i * 3 : h;
          const source = back === 0 ? positions : history;
          trailVertices[output] = source[p];
          trailVertices[output + 1] = source[p + 1];
          trailVertices[output + 2] = source[p + 2];
          trailColors[output] = red * fade;
          trailColors[output + 1] = green * fade;
          trailColors[output + 2] = fade;
          output += 3;
        }
      }
    }
    geometry.attributes.position.needsUpdate = true;
    geometry.attributes.color.needsUpdate = true;
    headsGeometry.attributes.position.needsUpdate = true;
  }

  function resize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
  addEventListener('resize', resize);
  resize();
  let previousTime = performance.now(), accumulator = 0;
  renderer.setAnimationLoop(now => {
    const delta = Math.min((now - previousTime) / 1000, 0.05);
    accumulator += delta;
    previousTime = now;
    star.rotation.y += delta * 0.18;
    star.rotation.z += delta * 0.09;
    while (accumulator >= FIXED_STEP) { simulate(); accumulator -= FIXED_STEP; }
    updateTrails();
    controls.update();
    renderer.render(scene, camera);
  });
  status.remove();
} catch (error) {
  status.textContent = 'Unable to start. Check your connection to the Three.js CDN and WebGL support.';
  console.error(error);
}
</script>
</body>
</html>

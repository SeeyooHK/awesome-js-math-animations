<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid Metal Tao</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050606; }
    canvas { display: block; width: 100%; height: 100%; }
    .error {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: #ddd;
      font: 14px/1.5 system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas aria-label="The Chinese character Tao written stroke by stroke in liquid metal"></canvas>
  <script>
    const canvas = document.querySelector('canvas');
    const gl = canvas.getContext('webgl2', {
      antialias: false,
      alpha: false,
      depth: false,
      stencil: false,
      powerPreference: 'high-performance'
    });

    if (!gl) {
      canvas.remove();
      document.body.insertAdjacentHTML('beforeend', '<p class="error">This animation needs a browser with WebGL 2 enabled.</p>');
      throw new Error('WebGL 2 is unavailable');
    }

    // Stroke geometry from Hanzi Writer Data / Make Me a Hanzi (Arphic Public License).
    const strokeData = {
      strokes: [
        'M 482 766 Q 533 697 557 694 Q 570 693 577 709 Q 580 722 571 742 Q 562 758 539 769 Q 503 788 488 791 Q 479 792 478 782 Q 477 775 482 766 Z',
        'M 699 802 Q 684 772 633 701 Q 626 685 641 690 Q 686 720 740 764 Q 756 780 777 791 Q 796 801 785 817 Q 772 832 747 843 Q 725 853 713 850 Q 701 849 706 836 Q 710 820 699 802 Z',
        'M 598 615 Q 682 630 819 635 Q 868 635 876 645 Q 880 655 865 667 Q 814 703 747 682 Q 597 651 398 616 Q 379 613 394 599 Q 407 587 423 583 Q 442 579 457 584 Q 508 600 566 609 L 598 615 Z',
        'M 576 516 Q 589 529 602 546 Q 609 553 619 562 Q 632 571 626 581 Q 620 596 598 615 C 575 635 565 639 566 609 Q 569 594 537 508 C 527 480 555 495 576 516 Z',
        'M 506 502 Q 505 505 500 506 Q 493 513 480 517 Q 471 521 461 518 Q 455 514 460 502 Q 475 439 475 353 Q 474 340 474 323 Q 474 292 464 252 Q 451 203 483 165 Q 493 153 502 164 Q 509 174 511 186 L 515 219 Q 515 256 515 294 L 515 320 Q 516 357 517 385 L 518 406 Q 519 458 521 463 Q 522 470 522 475 C 523 489 523 489 506 502 Z',
        'M 686 203 Q 713 169 733 135 Q 742 119 753 119 Q 768 120 783 152 Q 799 189 795 233 Q 788 308 779 446 Q 778 474 793 495 Q 802 507 793 516 Q 775 534 728 555 Q 712 564 697 555 Q 654 534 587 519 Q 580 518 576 516 L 537 508 Q 518 505 506 502 C 477 496 493 468 522 475 Q 534 478 551 482 Q 620 495 678 510 Q 702 514 713 506 Q 743 470 727 238 Q 727 237 727 235 Q 723 216 705 225 Q 704 226 701 227 C 671 232 668 227 686 203 Z',
        'M 517 385 L 664 405 Q 686 409 677 421 Q 667 434 643 438 Q 615 441 518 406 C 490 396 487 381 517 385 Z',
        'M 515 294 Q 519 294 524 294 Q 609 307 671 313 Q 693 317 685 329 Q 675 342 651 348 Q 621 352 515 320 C 486 311 485 294 515 294 Z',
        'M 511 186 Q 518 186 524 187 Q 576 197 686 203 C 716 205 725 208 701 227 Q 671 254 595 232 Q 552 225 515 219 C 485 214 481 185 511 186 Z',
        'M 236 706 Q 261 679 289 647 Q 302 632 319 632 Q 329 631 337 645 Q 343 660 336 692 Q 332 713 301 730 Q 228 766 212 759 Q 206 755 207 742 Q 210 730 236 706 Z',
        'M 302 180 Q 320 190 328 209 Q 340 246 300 309 Q 267 364 346 465 Q 368 483 348 499 Q 329 514 293 528 Q 271 541 253 523 Q 225 502 187 488 Q 136 467 120 470 Q 113 470 110 465 Q 109 461 117 456 Q 154 438 243 470 Q 253 473 262 460 Q 284 438 264 409 Q 218 360 264 289 Q 289 241 288 216 Q 285 200 281 182 C 276 161 278 162 302 180 Z',
        'M 281 182 Q 239 183 200 170 Q 161 157 101 154 Q 94 154 90 146 Q 87 139 95 128 Q 111 109 135 96 Q 147 90 165 103 Q 246 154 315 138 Q 379 125 510 69 Q 735 -33 815 -5 Q 873 16 924 52 Q 946 67 923 66 Q 721 59 562 100 Q 483 122 384 159 Q 344 177 302 180 L 281 182 Z'
      ],
      medians: [
        [[489,779],[541,737],[558,712]],
        [[718,839],[732,824],[738,805],[643,700]],
        [[396,608],[440,602],[618,638],[776,661],[812,662],[868,650]],
        [[572,606],[592,579],[566,534],[554,522],[541,519]],
        [[467,511],[489,483],[495,454],[495,314],[488,239],[493,170]],
        [[514,498],[540,493],[713,534],[740,518],[755,501],[761,224],[749,191],[717,199],[700,219]],
        [[524,390],[530,400],[602,415],[646,421],[668,415]],
        [[520,301],[552,316],[630,329],[653,330],[675,323]],
        [[517,191],[530,205],[692,224]],
        [[217,751],[290,697],[318,652]],
        [[117,463],[173,465],[263,496],[277,496],[302,477],[297,433],[266,359],[270,323],[302,260],[308,236],[308,212],[287,187]],
        [[102,142],[145,127],[249,160],[332,156],[594,63],[752,29],[824,33],[914,58]]
      ]
    };

    const maskCanvas = document.createElement('canvas');
    maskCanvas.width = maskCanvas.height = 1024;
    const maskContext = maskCanvas.getContext('2d');
    const strokeOutlines = strokeData.strokes.map(path => new Path2D(path));
    const strokeMetrics = strokeData.medians.map(points => {
      const segments = [];
      let total = 0;
      for (let i = 1; i < points.length; i++) {
        const length = Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]);
        segments.push(length);
        total += length;
      }
      return { segments, total, duration: 0.28 + Math.min(0.9, total / 650) };
    });
    const leadIn = 0.55;
    const strokePause = 0.08;
    const holdDuration = 2.4;
    const fadeDuration = 0.8;
    const drawDuration = strokeMetrics.reduce((sum, stroke) => sum + stroke.duration + strokePause, 0);
    const cycleDuration = leadIn + drawDuration + holdDuration + fadeDuration;

    function traceMedian(points, metric, progress) {
      const target = metric.total * progress;
      let walked = 0;
      let tip = points[0];
      maskContext.beginPath();
      maskContext.moveTo(tip[0], tip[1]);

      for (let i = 1; i < points.length; i++) {
        const length = metric.segments[i - 1];
        if (walked + length <= target) {
          tip = points[i];
          maskContext.lineTo(tip[0], tip[1]);
          walked += length;
          continue;
        }
        const ratio = Math.max(0, Math.min(1, (target - walked) / length));
        tip = [
          points[i - 1][0] + (points[i][0] - points[i - 1][0]) * ratio,
          points[i - 1][1] + (points[i][1] - points[i - 1][1]) * ratio
        ];
        maskContext.lineTo(tip[0], tip[1]);
        break;
      }
      return tip;
    }

    function paintStrokeMask(elapsed, showComplete) {
      maskContext.setTransform(1, 0, 0, 1, 0, 0);
      maskContext.clearRect(0, 0, 1024, 1024);
      maskContext.setTransform(0.94, 0, 0, -0.94, 32, 906);
      maskContext.lineCap = 'round';
      maskContext.lineJoin = 'round';
      maskContext.lineWidth = 170;

      let localTime = showComplete ? leadIn + drawDuration : elapsed % cycleDuration;
      let fade = 1;
      if (!showComplete && localTime > leadIn + drawDuration + holdDuration) {
        fade = 1 - (localTime - leadIn - drawDuration - holdDuration) / fadeDuration;
      }
      maskContext.globalAlpha = Math.max(0, Math.min(1, fade));
      localTime -= leadIn;

      for (let i = 0; i < strokeOutlines.length; i++) {
        const metric = strokeMetrics[i];
        const points = strokeData.medians[i];
        if (localTime >= metric.duration) {
          maskContext.fillStyle = '#ff0000';
          maskContext.fill(strokeOutlines[i]);
          localTime -= metric.duration + strokePause;
          continue;
        }
        if (localTime <= 0) break;

        const rawProgress = Math.min(1, localTime / metric.duration);
        const progress = 1 - Math.pow(1 - rawProgress, 1.55);
        maskContext.save();
        maskContext.clip(strokeOutlines[i]);
        const tip = traceMedian(points, metric, progress);
        maskContext.strokeStyle = '#ff0000';
        maskContext.stroke();
        maskContext.globalCompositeOperation = 'lighter';
        maskContext.fillStyle = '#00ff00';
        maskContext.beginPath();
        maskContext.arc(tip[0], tip[1], 82, 0, Math.PI * 2);
        maskContext.fill();
        maskContext.restore();
        break;
      }

      maskContext.globalAlpha = 1;
      maskContext.globalCompositeOperation = 'source-over';
    }

    const vertexSource = `#version 300 es
      precision highp float;

      const vec2 positions[3] = vec2[3](
        vec2(-1.0, -1.0),
        vec2( 3.0, -1.0),
        vec2(-1.0,  3.0)
      );

      void main() {
        gl_Position = vec4(positions[gl_VertexID], 0.0, 1.0);
      }
    `;

    const fragmentSource = `#version 300 es
      precision highp float;

      uniform vec2 uResolution;
      uniform float uTime;
      uniform sampler2D uMask;
      out vec4 outColor;

      mat2 rotate2d(float angle) {
        float c = cos(angle);
        float s = sin(angle);
        return mat2(c, -s, s, c);
      }

      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }

      float noise(vec2 p) {
        vec2 cell = floor(p);
        vec2 local = fract(p);
        local = local * local * (3.0 - 2.0 * local);

        float a = hash21(cell);
        float b = hash21(cell + vec2(1.0, 0.0));
        float c = hash21(cell + vec2(0.0, 1.0));
        float d = hash21(cell + vec2(1.0, 1.0));

        return mix(mix(a, b, local.x), mix(c, d, local.x), local.y);
      }

      float fbm(vec2 p) {
        float value = 0.0;
        float amplitude = 0.52;
        mat2 turn = rotate2d(0.57);

        for (int i = 0; i < 6; i++) {
          value += amplitude * noise(p);
          p = turn * p * 2.03 + vec2(7.7, 3.1);
          amplitude *= 0.5;
        }
        return value;
      }

      float fluidField(vec2 p, float time) {
        p = rotate2d(-0.38) * p;
        p *= vec2(1.52, 1.06);

        vec2 drift = vec2(-0.055, 0.077) * time;
        vec2 q = vec2(
          fbm(p * 0.64 + drift + vec2(0.0, 1.8)),
          fbm(p * 0.64 - drift * 0.72 + vec2(5.2, 8.3))
        );
        vec2 r = vec2(
          fbm(p * 0.92 + 1.85 * q + vec2(1.7, -time * 0.036)),
          fbm(p * 0.92 + 1.85 * q + vec2(8.6,  time * 0.029))
        );

        float body = fbm(p * 0.78 + 2.7 * q + 1.55 * r + drift * 0.35);
        float folds = fbm(p * 1.62 + 1.15 * r - drift * 0.3);
        float sweep = 0.075 * sin(p.x * 1.45 - p.y * 0.72 + time * 0.16);
        return body * 0.95 + folds * 0.24 + sweep - 0.565;
      }

      float paperGrain(vec2 fragCoord, float time) {
        return hash21(fragCoord + floor(time * 24.0) * 17.0) - 0.5;
      }

      float inkTone(float field) {
        float mass = smoothstep(-0.052, 0.058, field);
        float halo = exp(-abs(field) * 21.0);
        float fineContours = sin(field * 330.0 + sin(field * 73.0) * 1.8);
        float wideContours = sin(field * 116.0 - 0.6);
        float ripple = halo * (fineContours * 0.105 + wideContours * 0.065);
        return clamp(mass + ripple, 0.0, 1.0);
      }

      void main() {
        vec2 p = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
        float time = uTime;

        vec2 probe = vec2(0.0028, 0.0018) * (1.0 + 0.35 * sin(time * 0.23));
        float centerField = fluidField(p, time);
        float red   = inkTone(fluidField(p + probe * 1.45, time));
        float green = inkTone(centerField);
        float blue  = inkTone(fluidField(p - probe * 1.75, time));

        vec3 dark = vec3(0.008, 0.011, 0.010);
        vec3 light = vec3(0.91, 0.90, 0.86);
        vec3 color = vec3(
          mix(dark.r, light.r, red),
          mix(dark.g, light.g, green),
          mix(dark.b, light.b, blue)
        );

        vec2 slope = vec2(dFdx(centerField), dFdy(centerField)) * uResolution.y;
        vec3 normal = normalize(vec3(-slope * 0.72, 0.56));
        vec3 keyLight = normalize(vec3(
          -0.62 + 0.20 * sin(time * 0.13),
           0.48 + 0.18 * cos(time * 0.11),
           0.92
        ));
        vec3 fillLight = normalize(vec3(0.58, -0.44, 0.65));
        vec3 halfVector = normalize(keyLight + vec3(0.0, 0.0, 1.0));

        float diffuse = max(dot(normal, keyLight), 0.0);
        float reflectedFill = pow(max(dot(normal, fillLight), 0.0), 7.0);
        float broadSpecular = pow(max(dot(normal, halfVector), 0.0), 11.0);
        float sharpSpecular = pow(max(dot(normal, halfVector), 0.0), 72.0);

        vec2 reflection = normal.xy / (normal.z + 1.08);
        float reflectedBands = 0.5 + 0.5 * sin(
          reflection.x * 18.0 - reflection.y * 9.0 + time * 0.24
        );
        reflectedBands = pow(reflectedBands, 5.0);
        float brushedLines = 0.5 + 0.5 * sin(
          centerField * 510.0 + dot(p, vec2(82.0, -29.0)) - time * 0.36
        );
        brushedLines = pow(brushedLines, 9.0);

        color *= 0.47 + diffuse * 0.72;
        vec3 warmReflection = vec3(1.0, 0.93, 0.80);
        vec3 coolReflection = vec3(0.73, 0.88, 1.0);
        color += warmReflection * (broadSpecular * 0.50 + sharpSpecular * 1.08);
        color += coolReflection * reflectedFill * 0.28;
        color += mix(coolReflection, warmReflection, green) * reflectedBands * 0.22;

        float edge = exp(-abs(centerField) * 32.0);
        color += warmReflection * brushedLines * edge * 0.16;
        color.r += edge * (red - blue) * 0.68;
        color.b += edge * (blue - red) * 0.74;
        color.g += edge * (green - 0.5 * red - 0.5 * blue) * 0.22;

        float vignette = 1.0 - 0.22 * smoothstep(0.18, 0.82, dot(p, p));
        color *= vignette;
        color += paperGrain(gl_FragCoord.xy, time) * 0.013;
        color = pow(max(color, 0.0), vec3(0.94));

        vec2 maskUv = (gl_FragCoord.xy - 0.5 * uResolution.xy)
          / min(uResolution.x, uResolution.y) + 0.5;
        vec2 maskTexel = 1.0 / vec2(textureSize(uMask, 0));
        vec4 maskSample = texture(uMask, maskUv);
        float glyph = maskSample.r;
        float brushTip = maskSample.g;
        float maskLeft = texture(uMask, maskUv - vec2(maskTexel.x * 2.0, 0.0)).r;
        float maskRight = texture(uMask, maskUv + vec2(maskTexel.x * 2.0, 0.0)).r;
        float maskDown = texture(uMask, maskUv - vec2(0.0, maskTexel.y * 2.0)).r;
        float maskUp = texture(uMask, maskUv + vec2(0.0, maskTexel.y * 2.0)).r;
        float maskHigh = max(max(maskLeft, maskRight), max(maskDown, maskUp));
        float maskLow = min(min(maskLeft, maskRight), min(maskDown, maskUp));
        float calligraphyEdge = clamp(maskHigh - maskLow, 0.0, 1.0);
        float glyphAlpha = smoothstep(0.015, 0.72, glyph);

        vec3 background = vec3(0.0025, 0.0035, 0.0035);
        background += paperGrain(gl_FragCoord.xy, time) * 0.004;
        color += vec3(0.025, 0.03, 0.032);
        color += warmReflection * calligraphyEdge * 0.34;
        color += warmReflection * brushTip * (0.24 + sharpSpecular * 0.72);
        float outerGlow = smoothstep(0.02, 0.65, maskHigh) * (1.0 - glyphAlpha);
        vec3 finalColor = mix(background, color, glyphAlpha);
        finalColor += mix(coolReflection, warmReflection, red) * outerGlow * 0.09;

        outColor = vec4(finalColor, 1.0);
      }
    `;

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(message);
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }

    gl.useProgram(program);
    const resolutionLocation = gl.getUniformLocation(program, 'uResolution');
    const timeLocation = gl.getUniformLocation(program, 'uTime');
    const maskLocation = gl.getUniformLocation(program, 'uMask');
    const maskTexture = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, maskTexture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    paintStrokeMask(0, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
    gl.uniform1i(maskLocation, 0);
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const startedAt = performance.now();

    function resize() {
      const pixelRatio = Math.min(devicePixelRatio || 1, 2);
      const width = Math.round(innerWidth * pixelRatio);
      const height = Math.round(innerHeight * pixelRatio);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
        gl.viewport(0, 0, width, height);
      }
    }

    function render(now) {
      resize();
      const elapsed = reducedMotion ? 5.0 : (now - startedAt) / 1000;
      paintStrokeMask(elapsed, reducedMotion);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, maskTexture);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
      gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
      gl.uniform1f(timeLocation, elapsed);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (!reducedMotion) requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
